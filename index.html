<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>본노엘 운영</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#642e2c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="본노엘 운영">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#faf7f2; --surface:#ffffff; --surface-sunken:#f1ece3;
    --ink:#2b2420; --ink-soft:#6b6259; --ink-faint:#9a9086;
    --line:#e5ddd0; --line-strong:#d3c7b4;
    --accent:#642e2c; --accent-soft:#f0e2e0; --accent-ink:#f7efe4;
    --danger:#b5432c; --danger-soft:#f6dfd8;
    --ok:#2f7a4f; --ok-soft:#dcefe1;
    --warn:#9a6b12; --warn-soft:#fbeccb;
    --tile-blue:#e3ebfa; --tile-green:#e2f2e6; --tile-orange:#fbe8d8; --tile-purple:#ece4f7; --tile-yellow:#fbf1cf; --tile-gray:#ebe8e3; --tile-red:#f9e1e0;
    --shadow: 0 1px 2px rgba(43,36,32,0.06), 0 6px 18px -10px rgba(43,36,32,0.22);
    --radius-s:6px; --radius-m:12px; --radius-l:18px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1c1713; --surface:#252019; --surface-sunken:#2c261e;
      --ink:#f1ece3; --ink-soft:#b7ada0; --ink-faint:#847a6e;
      --line:#3a3226; --line-strong:#4a4030;
      --accent:#d9a39e; --accent-soft:#3b2523; --accent-ink:#2a1412;
      --danger:#e59078; --danger-soft:#3a241d;
      --ok:#7bc79a; --ok-soft:#1e2f24;
      --warn:#e0b45a; --warn-soft:#3a2f14;
      --tile-blue:#26304a; --tile-green:#22392a; --tile-orange:#3f2d1e; --tile-purple:#33283f; --tile-yellow:#3d341a; --tile-gray:#332e28; --tile-red:#3f2424;
      color-scheme: dark;
    }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%; }
  a{ color:inherit; text-decoration:none; }
  button{ font:inherit; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 16px 96px; }
  .loading{ padding:60px 0; text-align:center; color:var(--ink-faint); }

  .topbar{ display:flex; align-items:center; gap:10px; padding:14px 0 10px; position:sticky; top:0; background:var(--paper); z-index:5; }
  .topbar h1{ font-size:20px; margin:0; flex:1; font-weight:700; }
  .topbar .back{ border:0; background:transparent; font-size:22px; padding:4px 8px 4px 0; color:var(--ink-soft); cursor:pointer; }
  .who{ font-size:13px; color:var(--ink-soft); background:var(--surface-sunken); border-radius:999px; padding:4px 10px; border:1px solid var(--line); cursor:pointer; white-space:nowrap; }

  .group-title{ font-size:14px; color:var(--ink-soft); margin:18px 4px 8px; font-weight:500; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); box-shadow:var(--shadow); overflow:hidden; }
  .row{ display:flex; align-items:center; gap:14px; padding:14px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row:last-child{ border-bottom:0; }
  .row:active{ background:var(--surface-sunken); }
  .row.disabled{ opacity:.55; }
  .tile{ width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:24px; flex:none; }
  .rt{ flex:1; min-width:0; }
  .rtitle{ font-weight:600; font-size:17px; }
  .rsub{ font-size:13px; color:var(--ink-soft); }
  .chev{ color:var(--ink-faint); font-size:20px; }
  .badge{ font-size:12px; padding:2px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:600; white-space:nowrap; }
  .badge.danger{ background:var(--danger-soft); color:var(--danger); }
  .badge.ok{ background:var(--ok-soft); color:var(--ok); }
  .badge.warn{ background:var(--warn-soft); color:var(--warn); }
  .badge.muted{ background:var(--surface-sunken); color:var(--ink-soft); }

  .summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .summary a{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:10px 8px; text-align:center; }
  .summary .n{ font-size:24px; font-weight:700; line-height:1.1; }
  .summary .n.danger{ color:var(--danger); }
  .summary .l{ font-size:12px; color:var(--ink-soft); }

  .section{ margin-top:16px; }
  .sec-h{ display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--surface-sunken); font-weight:600; font-size:14px; border-bottom:1px solid var(--line); }
  .sec-h .sp{ flex:1; }
  .item{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); }
  .item:last-child{ border-bottom:0; }
  .iname{ flex:1; min-width:0; }
  .iname .t{ font-weight:500; }
  .iname .s{ font-size:12px; color:var(--ink-soft); }
  .iname .s.warn{ color:var(--warn); }
  .qty{ width:76px; padding:8px 6px; border:1px solid var(--line-strong); border-radius:var(--radius-s); font-size:17px; text-align:center; background:var(--surface); color:var(--ink); }
  .qty:focus{ outline:2px solid var(--accent); border-color:transparent; }
  .qty.filled{ background:var(--ok-soft); }
  .unit{ font-size:13px; color:var(--ink-soft); width:34px; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 16px; border-radius:var(--radius-m); border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-weight:600; cursor:pointer; font-size:15px; }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn.danger{ background:var(--danger-soft); color:var(--danger); border-color:transparent; }
  .btn.ok{ background:var(--ok-soft); color:var(--ok); border-color:transparent; }
  .btn.sm{ padding:6px 10px; font-size:13px; border-radius:8px; }
  .btn.block{ width:100%; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .stickybar{ position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:var(--paper); border-top:1px solid var(--line); z-index:6; }
  .stickybar .inner{ max-width:560px; margin:0 auto; display:flex; gap:8px; }

  .form{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); padding:14px 16px; display:grid; gap:10px; }
  .form label{ font-size:13px; color:var(--ink-soft); display:block; margin-bottom:4px; }
  .in, select.in{ width:100%; padding:10px 12px; border:1px solid var(--line-strong); border-radius:var(--radius-s); font-size:16px; background:var(--surface); color:var(--ink); }
  .in:focus{ outline:2px solid var(--accent); border-color:transparent; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .inline{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .muted{ color:var(--ink-soft); font-size:13px; }
  .empty{ padding:24px 16px; text-align:center; color:var(--ink-faint); font-size:14px; }
  .note{ background:var(--warn-soft); color:var(--warn); border-radius:var(--radius-m); padding:10px 14px; font-size:13px; margin-top:12px; }
  .note.danger{ background:var(--danger-soft); color:var(--danger); }
  .note.ok{ background:var(--ok-soft); color:var(--ok); }

  .tabs{ display:flex; gap:6px; overflow-x:auto; padding:4px 0 8px; }
  .tab{ padding:7px 14px; border-radius:999px; border:1px solid var(--line-strong); background:var(--surface); font-size:14px; white-space:nowrap; cursor:pointer; }
  .tab.on{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  .pin-wrap{ text-align:center; padding:20px 0; }
  .pin{ font-size:32px; letter-spacing:14px; width:200px; text-align:center; padding:10px; border:1px solid var(--line-strong); border-radius:var(--radius-m); background:var(--surface); color:var(--ink); }
  .pin:focus{ outline:2px solid var(--accent); }
  .name-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .name-grid .btn{ padding:14px 8px; font-size:16px; }
  .expand{ padding:10px 14px 14px 72px; background:var(--surface-sunken); border-bottom:1px solid var(--line); }

  .toast{ position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:999px; font-size:14px; opacity:0; transition:.2s; pointer-events:none; z-index:20; max-width:90vw; text-align:center; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .hist{ font-size:13px; color:var(--ink-soft); padding:8px 14px; border-bottom:1px solid var(--line); display:flex; gap:8px; }
  .hist:last-child{ border-bottom:0; }
  .hist .sp{ flex:1; }
  .hidden{ display:none !important; }
  .sigpad{ width:100%; height:170px; border:1px dashed var(--line-strong); border-radius:var(--radius-m); background:#fff; touch-action:none; display:block; }
  .sigprev{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-m); padding:6px; text-align:center; }
  .sigprev img{ height:60px; }
  .docview{ background:#fff; color:#111; border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden; }
  .docview .bnd .page{ width:auto !important; min-height:0 !important; padding:14px 12px !important; page-break-after:auto !important; border-bottom:1px dashed #ccc; }
  .docview .bnd .page:last-child{ border-bottom:0; }
  .docview .bnd{ font-size:13.5px !important; }
  .docview .bnd h1{ font-size:19px !important; letter-spacing:3px !important; }
  .docview .bnd table{ font-size:12px !important; }
  .chk{ display:flex; gap:10px; align-items:flex-start; padding:10px 14px; border-bottom:1px solid var(--line); font-size:15px; cursor:pointer; }
  .chk:last-child{ border-bottom:0; }
  .chk input{ width:22px; height:22px; flex:none; margin-top:1px; }
  .steps{ display:flex; gap:4px; margin:4px 4px 10px; }
  .steps span{ flex:1; height:5px; border-radius:3px; background:var(--line); }
  .steps span.on{ background:var(--accent); }
  .steps span.done{ background:var(--ok); }
  table.grid{ border-collapse:collapse; font-size:11px; min-width:100%; }
  table.grid th, table.grid td{ border:1px solid var(--line); padding:2px 3px; vertical-align:top; min-width:60px; }
  table.grid th{ background:var(--surface-sunken); font-weight:500; color:var(--ink-soft); position:sticky; left:0; }
  table.grid th:first-child{ min-width:44px; z-index:1; }
  table.grid .on{ background:var(--accent-soft); }
  .chip{ display:inline-block; padding:0 4px; margin:1px; border-radius:4px; background:var(--tile-gray); color:#2b2420; white-space:nowrap; }
  .chip.sub{ outline:2px solid var(--accent); outline-offset:-1px; font-weight:600; }
  .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; border:1px solid rgba(0,0,0,.15); }
  .chip.covering{ background:var(--warn-soft); color:var(--warn); }
  .chip.work{ background:var(--ok-soft); color:var(--ok); }
  .chip.brk{ background:transparent; color:var(--ink-faint); border:1px dashed var(--line-strong); }
  .chip.requested{ background:var(--tile-gray); color:var(--ink-faint); }
  textarea.in{ font-family:inherit; }
  .slip{ background:#fff; color:#111; border:1px solid var(--line); border-radius:var(--radius-m); padding:16px; }
  .slip h2{ text-align:center; margin:0 0 12px; font-size:20px; }
  .slip-meta{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:10px; }
  .slip-t{ width:100%; border-collapse:collapse; margin-bottom:12px; font-size:13px; }
  .slip-t th, .slip-t td{ border:1px solid #bbb; padding:6px 8px; text-align:left; }
  .slip-t th{ background:#f2f2f2; font-weight:600; }
  .slip-t td.r{ text-align:right; }
  @media print{ body{ background:#fff; } .noprint, .topbar, .stickybar, .toast{ display:none !important; } .wrap{ max-width:none; padding:0; } .slip{ border:0; } }
  code{ background:var(--surface-sunken); padding:1px 4px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<div id="app" class="wrap"><div class="loading">불러오는 중…</div></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="docs-templates.js"></script>
<script>
(function(){
  'use strict';

  // ===== 설정 =====
  // 매뉴얼북·로그북과 같은 Supabase 프로젝트를 씁니다 (테이블만 추가). anon/publishable 키는 공개되어도 되는 값.
  var SUPABASE_URL = 'https://caetlljnyxsusswqhtci.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_Oiqo2urdo-9s-HIso3rkmQ_7pP-I0nV';
  var LINKS = { manual: 'https://bakery-manual-book.vercel.app', logbook: 'https://bonnoel-manager-logbook.vercel.app',
    hiring: 'https://bonnoel-hiring.vercel.app/', hiringAdmin: 'https://bonnoel-hiring.vercel.app/#admin', hiringWelcome: 'https://bonnoel-hiring.vercel.app/#welcome' };
  var DEMO = /[?&]demo=1/.test(location.search);   // ?demo=1 : 창고 없이 가짜 데이터로 눌러보기

  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function uid(){ return 'x' + Math.random().toString(36).slice(2) + Date.now().toString(36); }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function addDays(dateStr, n){ var d = new Date(dateStr + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function md(s){ if(!s) return ''; var d = new Date(s); if (isNaN(d)) return ''; return (d.getMonth()+1) + '/' + d.getDate(); }
  function num(v){ var n = parseFloat(v); return isNaN(n) ? null : n; }
  function fmtQ(n){ if (n == null) return '-'; return (Math.round(n * 100) / 100).toString(); }
  function daysAgo(n){ var d = new Date(); d.setDate(d.getDate() - n); return d.toISOString(); }

  // ===== 데이터 창고 어댑터 =====
  var db = null;

  function makeSupabaseDb(sb){
    function applyMatch(q, opt){
      if (!opt) return q;
      var k;
      if (opt.eq) for (k in opt.eq) q = q.eq(k, opt.eq[k]);
      if (opt.in) for (k in opt.in) q = q.in(k, opt.in[k]);
      if (opt.gte) for (k in opt.gte) q = q.gte(k, opt.gte[k]);
      if (opt.is) for (k in opt.is) q = q.is(k, opt.is[k]);
      return q;
    }
    return {
      select: async function(table, opt){
        var q = sb.from(table).select('*');
        q = applyMatch(q, opt);
        if (opt && opt.order) q = q.order(opt.order.col, { ascending: opt.order.asc !== false });
        if (opt && opt.limit) q = q.limit(opt.limit);
        var r = await q; if (r.error) throw r.error; return r.data || [];
      },
      insert: async function(table, rows){ var r = await sb.from(table).insert(rows).select(); if (r.error) throw r.error; return r.data; },
      update: async function(table, match, patch){ var q = sb.from(table).update(patch); q = applyMatch(q, { eq: match }); var r = await q.select(); if (r.error) throw r.error; return r.data; },
      upsert: async function(table, rows, onConflict){ var r = await sb.from(table).upsert(rows, { onConflict: onConflict }).select(); if (r.error) throw r.error; return r.data; },
      remove: async function(table, match){ var q = sb.from(table).delete(); q = applyMatch(q, { eq: match }); var r = await q; if (r.error) throw r.error; },
      // 영수증 사진 저장소 + 자동 읽기 함수
      upload: async function(bucket, path, blob, type){ var r = await sb.storage.from(bucket).upload(path, blob, { contentType: type, upsert: false }); if (r.error) throw r.error; return path; },
      signedUrl: async function(bucket, path){ var r = await sb.storage.from(bucket).createSignedUrl(path, 3600); if (r.error) throw r.error; return r.data.signedUrl; },
      removeFile: async function(bucket, path){ var r = await sb.storage.from(bucket).remove([path]); if (r.error) throw r.error; },
      ocr: async function(b64, mime, kind){
        var res = await fetch(SUPABASE_URL + '/functions/v1/read-receipt', { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }, body: JSON.stringify({ image_base64: b64, media_type: mime, kind: kind || 'expense' }) });
        var j = null; try { j = await res.json(); } catch(e){}
        if (!res.ok) throw new Error((j && j.error) || (res.status === 404 ? '자동 읽기 함수(read-receipt)가 아직 배포되지 않았어요' : '서버 응답 ' + res.status));
        return j;
      },
      // 입사 서류 PDF 메일 발송 함수
      sendDocs: async function(batchId){
        var res = await fetch(SUPABASE_URL + '/functions/v1/send-document', { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }, body: JSON.stringify({ batch_id: batchId, ua: navigator.userAgent.slice(0, 300) }) });
        var j = null; try { j = await res.json(); } catch(e){}
        if (!res.ok) throw new Error((j && j.error) || (res.status === 404 ? '메일 발송 함수(send-document)가 아직 배포되지 않았어요' : '서버 응답 ' + res.status));
        return j;
      }
    };
  }

  function makeMemoryDb(tables){
    function match(row, opt){
      if (!opt) return true;
      var k;
      if (opt.eq) for (k in opt.eq) if (row[k] !== opt.eq[k]) return false;
      if (opt.in) for (k in opt.in) if (opt.in[k].indexOf(row[k]) < 0) return false;
      if (opt.gte) for (k in opt.gte) if (!(row[k] >= opt.gte[k])) return false;
      if (opt.is) for (k in opt.is) if (row[k] !== opt.is[k]) return false;
      return true;
    }
    function clone(x){ return JSON.parse(JSON.stringify(x)); }
    return {
      select: async function(table, opt){
        var rows = (tables[table] || []).filter(function(r){ return match(r, opt); });
        if (opt && opt.order){ var c = opt.order.col, asc = opt.order.asc !== false; rows.sort(function(a,b){ return (a[c] > b[c] ? 1 : a[c] < b[c] ? -1 : 0) * (asc ? 1 : -1); }); }
        if (opt && opt.limit) rows = rows.slice(0, opt.limit);
        return clone(rows);
      },
      insert: async function(table, rows){ rows = Array.isArray(rows) ? rows : [rows]; tables[table] = tables[table] || []; var out = rows.map(function(r){ var x = Object.assign({ id: uid(), created_at: new Date().toISOString() }, r); tables[table].push(x); return x; }); return clone(out); },
      update: async function(table, m, patch){ var out = []; (tables[table] || []).forEach(function(r){ if (match(r, { eq: m })) { Object.assign(r, patch); out.push(r); } }); return clone(out); },
      upsert: async function(table, rows, onConflict){ var keys = (onConflict || 'id').split(','); tables[table] = tables[table] || []; rows.forEach(function(r){ var hit = tables[table].filter(function(x){ return keys.every(function(k){ return x[k] === r[k]; }); })[0]; if (hit) Object.assign(hit, r); else tables[table].push(Object.assign({ id: uid() }, r)); }); return clone(rows); },
      remove: async function(table, m){ tables[table] = (tables[table] || []).filter(function(r){ return !match(r, { eq: m }); }); },
      upload: async function(bucket, path, blob, type){ tables.__files = tables.__files || {}; tables.__files[path] = blob; return path; },

  var base = { branches: [], staff: [], categories: [], items: [], itemBranch: [] };
  async function loadBase(){

      db.select('manual_branches', { order: { col: 'sort_order' } }),
      db.select('manual_staff', { order: { col: 'name' } }),
      db.select('ops_categories', { order: { col: 'sort_order' } }),

    ]);

    // 명단에 없는 사람(퇴사·시연 모드 기억 등)으로 들어와 있으면 다시 로그인

  function branchName(id){ var b = base.branches.filter(function(x){ return x.id === id; })[0]; return b ? b.name : '?'; }
  function itemById(id){ return base.items.filter(function(x){ return x.id === id; })[0]; }
  function staffName(id){ var s = base.staff.filter(function(x){ return x.id === id; })[0]; return s ? s.name : ''; }
  function itemsForBranch(branchId){
    var map = {};
    base.itemBranch.forEach(function(ib){ if (ib.branch_id === branchId) map[ib.item_id] = ib; });
    return base.items.filter(function(it){ return it.active !== false && map[it.id] && map[it.id].active !== false; })
      .map(function(it){ return { item: it, target: num(map[it.id].target_qty) || 0 }; });
  }
  function groupByCategory(list){ // list: [{item,...}]
    var groups = [];
    base.categories.concat([{ id: null, name: '기타', sort_order: 9999 }]).forEach(function(c){
      var rows = list.filter(function(x){ return (x.item.category_id || null) === c.id; });
      rows.sort(function(a,b){ return (a.item.sort_order||0) - (b.item.sort_order||0); });
      if (rows.length) groups.push({ cat: c, rows: rows });
    });
    return groups;

  // ===== 재고 계산 =====
  // 추정 현재고 = 마지막 체크 수량 + 그 뒤 도착한 주문 + 그 뒤 받은 이동 − 그 뒤 보낸 이동
  async function loadStock(branchIds){
    var since = daysAgo(120);
    var r = await Promise.all([
      db.select('ops_stock_checks', { in: { branch_id: branchIds }, gte: { checked_at: since }, order: { col: 'checked_at', asc: false } }),
      db.select('ops_orders', { in: { branch_id: branchIds }, gte: { ordered_at: since } }),
      db.select('ops_transfers', { gte: { created_at: since } })
    ]);
    var checks = r[0], orders = r[1], transfers = r[2];
    var out = {};
    branchIds.forEach(function(b){
      var latest = {};
      checks.forEach(function(c){ if (c.branch_id === b && !latest[c.item_id]) latest[c.item_id] = c; });
      var m = {};
      itemsForBranch(b).forEach(function(x){
        var it = x.item, last = latest[it.id] || null;
        var est = last ? num(last.qty) : null;
        var pending = 0, pendingList = [];
        orders.forEach(function(o){
          if (o.branch_id !== b || o.item_id !== it.id) return;
          if (o.status === 'ordered'){ pending += num(o.qty) || 0; pendingList.push({ kind: 'order', qty: num(o.qty), eta: o.eta_date, id: o.id }); }
          else if (o.status === 'received' && last && o.received_at > last.checked_at && est != null) est += num(o.received_qty) || 0;
        });
        transfers.forEach(function(t){
          if (t.item_id !== it.id) return;
          if (t.to_branch === b){
            if (!t.received_at){ pending += num(t.qty) || 0; pendingList.push({ kind: 'transfer', qty: num(t.qty), from: t.from_branch, id: t.id }); }
            else if (last && t.received_at > last.checked_at && est != null) est += num(t.received_qty) || 0;
          }
          if (t.from_branch === b && last && t.created_at > last.checked_at && est != null) est -= num(t.qty) || 0;
        });
        if (est != null && est < 0) est = 0;   // 보낸 게 종이 재고보다 많으면 0으로 봄
        var shortage = (est != null && x.target > 0) ? Math.max(0, x.target - est - pending) : 0;
        m[it.id] = { item: it, target: x.target, last: last, est: est, pending: pending, pendingList: pendingList, shortage: shortage };
      });
      out[b] = m;
    });
    return { byBranch: out, orders: orders, transfers: transfers };
  }

  // ===== 근무표 · 휴무 · 대타 =====
  var PALETTE = ['#fde68a','#bfdbfe','#bbf7d0','#fbcfe8','#ddd6fe','#fed7aa','#a5f3fc','#fecaca','#d9f99d','#e9d5ff','#fef08a','#c7d2fe','#fcd5b4','#b2f0e6','#f5c6e0','#d4e2ff'];
  var WD = ['일','월','화','수','목','금','토'];
  var WD_ORDER = [1,2,3,4,5,6,0];
  function toMin(t){ if (!t) return null; var p = t.split(':'); return (+p[0]) * 60 + (+p[1]); }
  function fromMin(m){ return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function dateObj(s){ return new Date(s + 'T00:00:00'); }
  function wdOf(s){ return dateObj(s).getDay(); }
  function fmtDateK(s){ var d = dateObj(s); return (d.getMonth()+1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')'; }
  function nowMin(){ var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function shiftPassed(dateStr, startTime){ var t = todayStr(); return dateStr < t || (dateStr === t && nowMin() >= toMin(startTime)); }
  function overlaps(aS, aE, bS, bE){ return toMin(aS) < toMin(bE) && toMin(bS) < toMin(aE); }
  function weekStart(dateStr){ var d = dateObj(dateStr); var day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function tRange(s, e){ return s + '~' + e; }
  var STATUS_K = { requested: '신청함', rejected: '거절됨', covering: '대타 구하는 중', confirmed: '확정', cancelled: '취소' };

  async function loadSchedule(branchIds, fromDate, toDate){
    var r = await Promise.all([
      db.select('ops_shift_patterns', { in: { branch_id: branchIds }, eq: { active: true } }),
      db.select('ops_leave_requests', { in: { branch_id: branchIds }, gte: { date: fromDate }, order: { col: 'date' } })
    ]);
    var reqs = r[1].filter(function(q){ return q.date <= toDate; });
    var offers = reqs.length ? await db.select('ops_sub_offers', { in: { request_id: reqs.map(function(q){ return q.id; }) } }) : [];
    return { patterns: r[0], requests: reqs, offers: offers };
  }
  // 그 주에 쓸 패턴: 그 주 전용 표가 있으면 그것, 없으면 고정 패턴
  function poolFor(sch, branchId, dateStr){
    var ws = weekStart(dateStr);
    var weekly = sch.patterns.filter(function(p){ return p.branch_id === branchId && p.week_start === ws; });
    return weekly.length ? weekly : sch.patterns.filter(function(p){ return p.branch_id === branchId && !p.week_start; });
  }
  function weekLabel(ws){ return fmtDateK(ws) + '~' + fmtDateK(addDays(ws, 6)); }
  // 특정 날짜의 근무 목록 = 패턴 + 휴무·대타 반영
  function shiftsOn(sch, branchId, dateStr){
    var wd = wdOf(dateStr), out = [];
    poolFor(sch, branchId, dateStr).forEach(function(p){
      if (p.weekday !== wd) return;
      var st = base.staff.filter(function(s){ return s.id === p.staff_id; })[0]; if (!st || st.active === false) return;
      var row = { staffId: p.staff_id, name: st.name, start: p.start_time, end: p.end_time, brk: p.break_start ? p.break_start + '~' + p.break_end : '', kind: 'normal', req: null };
      var q = sch.requests.filter(function(x){ return x.staff_id === p.staff_id && x.date === dateStr && x.start_time === p.start_time && ['requested','covering','confirmed'].indexOf(x.status) >= 0; })[0];
      if (q){

  function parseStatement(text, ym){
    var out = [], col = null;
    var toDate = function(t){ var m; t = t.trim();
      if ((m = t.match(/(20\d{2})[.\-\/년]\s*(\d{1,2})[.\-\/월]\s*(\d{1,2})/))) return m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
      if ((m = t.match(/^(\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/))) return '20' + m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);   // 26.08.10
      if ((m = t.match(/^(20\d{2})(\d{2})(\d{2})$/))) return m[1] + '-' + m[2] + '-' + m[3];
      if ((m = t.match(/^(\d{1,2})[.\/](\d{1,2})\.?$/))) return ym.slice(0, 4) + '-' + pad(+m[1]) + '-' + pad(+m[2]);
      return null; };
    var toAmt = function(t){ t = t.replace(/\s/g, ''); if (!/^-?[\d,]+원?$/.test(t)) return null; var n = parseInt(t.replace(/[^\d-]/g, ''), 10); return isNaN(n) ? null : n; };
    var last4Of = function(t){ var m = /[*xX]/.test(t) && t.match(/(\d{4})\D*$/); return m ? m[1] : null; };
    text.split(/\r?\n/).forEach(function(line){
      if (!line.trim()) return;
      var toks = (line.indexOf('\t') >= 0 ? line.split('\t') : line.split(/\s{2,}|,(?!\d{3}\b)/)).map(function(t){ return t.trim(); });
      // 머리글 줄이면 열 위치를 기억해 둠 (카드사마다 열 순서가 달라서). 머리글이 없으면 아래에서 형태로 추측.
      var hi = function(re){ for (var i = 0; i < toks.length; i++) if (re.test(toks[i].replace(/\s/g, ''))) return i; return -1; };
      var ai = hi(/^(이용금액|승인금액|결제금액|거래금액|이용액|금액)$/), di = hi(/^(이용일자?|승인일자?|거래일자?|결제일자?|이용일시|승인일시|일자)$/);
      if (ai >= 0 && di >= 0){ col = { date: di, amount: ai, merchant: hi(/^(가맹점명?|이용가맹점|이용처|거래처|사용처|상호)$/), card: hi(/^(카드번호|카드)$/) }; return; }
      var date = null, amount = null, last4 = null, merchant = '';
      if (col){
        date = toDate(toks[col.date] || ''); amount = toAmt(toks[col.amount] || '');
        if (col.merchant >= 0) merchant = toks[col.merchant] || '';
        if (col.card >= 0) last4 = last4Of(toks[col.card] || '');
        if (!last4) toks.forEach(function(t){ if (!last4) last4 = last4Of(t); });

  function normBirth(v){

  }

  async function buyUpdate(id){

        case 'cards-save': await cardsSave(); break;
        // 입사 서류
        case 'docs-new-staff': { var nn = window.prompt('새 직원 이름'); if (!nn) break; nn = nn.trim(); if (!nn) break; if (base.staff.some(function(x){ return x.name === nn && x.active !== false; })){ toast('이미 명단에 있는 이름이에요'); break; } var nr = await db.insert('manual_staff', { name: nn, branch_id: el.getAttribute('data-branch'), role: 'staff', active: true }); toast(nn + ' 추가했어요'); nav('#/docs-prep/' + nr[0].id); break; }
        case 'docs-del-batch': if (window.confirm('준비한 서류를 지울까요? (서명 전 서류만 지워져요)')){ await db.remove('ops_documents', { batch_id: id }); toast('지웠어요'); if (current.route === 'docs-view') nav('#/docs-admin'); else render(); } break;
        case 'docs-resend': await docsResend(id, el); break;
        case 'docs-open-pdf': { var du = await db.signedUrl(DOCS_BUCKET, el.getAttribute('data-path')); window.open(du, '_blank'); break; }
        case 'docs-settings-save': await docsSettingsSave(); break;
        case 'docs-seal-remove': await saveDocsSettings({ seal: null }); toast('직인을 지웠어요'); render(); break;
        case 'prep-uni-add': prepRead(); prepState.uniform.push({ item: '', size: '', qty: 1 }); prepKeep = true; render(); break;
        case 'prep-uni-del': prepRead(); prepState.uniform.splice(+el.getAttribute('data-i'), 1); if (!prepState.uniform.length) prepState.uniform.push({ item: '', size: '', qty: 1 }); prepKeep = true; render(); break;
        case 'prep-save': el.disabled = true; try { await prepSave(); } finally { el.disabled = false; } break;
        case 'sign-branch': signState.branchId = id; try { localStorage.setItem(KIOSK_KEY, id); } catch(err){} render(); break;
        case 'sign-branch-reset': signState.branchId = null; try { localStorage.removeItem(KIOSK_KEY); } catch(err){} if (session && !isOwner()){ toast('내 매장에서만 서명할 수 있어요'); break; } render(); break;
        case 'sign-pick': signState.staffId = id; signState.ok = false; render(); break;
        case 'sign-back': signReset(); render(); break;
        case 'sign-pin': await signPin(); break;
        case 'sign-info-next': el.disabled = true; try { await signInfoNext(); } finally { el.disabled = false; } break;
        case 'sign-prev': signReadChecks(); var sd = sigPadData('sigpad'); if (sd) signState.sig = sd; signState.idx = Math.max(0, signState.idx - 1); render(); break;
        case 'sign-doc-next': el.disabled = true; try { await signDocNext(false); } finally { el.disabled = false; } break;
        case 'sign-gskip': el.disabled = true; try { await signDocNext(true); } finally { el.disabled = false; } break;
        case 'sig-clear': sigPadClear(id); break;
        case 'sig-redo': signReadChecks(); signState.sig = null; render(); break;
        case 'gsig-redo': signReadChecks(); signState.gsig = null; render(); break;
        case 'sign-restart': signReset(); render(); break;
      }
    } catch(err){ console.error(err); toast('실패했어요: ' + (err.message || err)); }
  });
  app.addEventListener('change', async function(e){
    if (e.target.id === 'exp-file'){ await expPhotoPicked(e.target.files && e.target.files[0]); return; }
    if (e.target.id === 'stmt-text'){ if (e.target.value.trim()) { try { await stmtRun(); } catch(err){ toast('실패: ' + (err.message || err)); } } return; }   // 붙여넣기만 해도 바로 저장·대조
    if (e.target.id === 'buy-file'){ await buyPhotoPicked(e.target.files && e.target.files[0]); return; }
    if (e.target.id === 'buy-method'){ buyRecalc(buyIdsForm(), e.target.id); return; }
    { var bmm = /^bm-(.+)$/.exec(e.target.id || ''); if (bmm){ buyRecalc(buyIdsRow(bmm[1]), e.target.id); return; } }
    if (e.target.id === 'exp-card'){ var opt = e.target.selectedOptions && e.target.selectedOptions[0], bsel = document.getElementById('exp-branch'); if (opt && bsel && opt.value && opt.getAttribute('data-ask') !== '1') bsel.value = opt.getAttribute('data-branch') || ''; return; }
    var el = e.target.closest('[data-act="role"]'); if (!el) return;
    try { await db.update('manual_staff', { id: el.getAttribute('data-id') }, { role: el.value }); toast('역할을 바꿨어요'); render(); } catch(err){ toast('실패: ' + (err.message || err)); }
  });
  app.addEventListener('keydown', function(e){ if (e.key === 'Enter' && e.target.classList.contains('pin')){ e.preventDefault(); if (current.route === 'sign') signPin(); else if (current.route === 'clock') clockPin(); else pinGo(); } });
  app.addEventListener('input', function(e){
    if (e.target.classList.contains('birth')){ fmtBirthTyping(e.target); return; }
    if (/^buy-(list|disc|paid)$/.test(e.target.id || '')){ buyRecalc(buyIdsForm(), e.target.id); return; }
    var bim = /^b[lcp]-(.+)$/.exec(e.target.id || ''); if (bim){ buyRecalc(buyIdsRow(bim[1]), e.target.id); return; }
    if (current.route !== 'check' || !e.target.classList.contains('qty')) return;
    e.target.classList.toggle('filled', e.target.value !== '');
    var c = document.getElementById('cnt'); if (c) c.textContent = '(' + app.querySelectorAll('.qty.filled').length + '/' + (app._checkTotal || 0) + ')';
  });

  // ===== 시작 =====
  if (DEMO) db = makeMemoryDb(demoSeed());
  else if (window.supabase && typeof window.supabase.createClient === 'function') db = makeSupabaseDb(window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY));
  if (!db){ app.innerHTML = '<div class="note danger">데이터 창고 연결 스크립트를 못 불러왔어요. 인터넷을 확인하고 새로고침해 주세요.</div>'; return; }
  if (DEMO && session && session.staffId && session.staffId.length > 4) saveSession(null);
  window.addEventListener('hashchange', render);
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
