<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>본노엘 운영</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json" id="app-manifest">
<meta name="theme-color" content="#642e2c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="본노엘 운영">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root{
    /* 본노엘 브랜드 사이트(bonnoel.com)와 같은 색·글꼴 톤 */
    --paper:#fffdfd; --surface:#ffffff; --surface-sunken:#fbf0f0;
    --ink:#231717; --ink-soft:#6e5f5e; --ink-faint:#9b8b8a;
    --line:#eee1e0; --line-strong:#e1c6c7;
    --accent:#af4c60; --accent-soft:#ffe1e3; --accent-ink:#fffdfd;
    --danger:#b54a46; --danger-soft:#ffe7e4;
    --ok:#2f7a4f; --ok-soft:#dcefe1;
    --warn:#9a6b12; --warn-soft:#fbeccb;
    --tile-blue:#e3ebfa; --tile-green:#e2f2e6; --tile-orange:#fbe8d8; --tile-purple:#ece4f7; --tile-yellow:#fbf1cf; --tile-gray:#ebe8e3; --tile-red:#f9e1e0;
    --shadow: 0 1px 2px rgba(35,23,23,0.06), 0 6px 18px -10px rgba(35,23,23,0.22);
    --radius-s:10px; --radius-m:14px; --radius-l:22px;
    --font-sans:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --font-serif:"Gowun Batang","Cormorant Garamond",ui-serif,Georgia,serif;
    --font-latin:"Cormorant Garamond","Gowun Batang",ui-serif,Georgia,serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#110909; --surface:#1b1110; --surface-sunken:#26191a;
      --ink:#f2e9e8; --ink-soft:#ab9a99; --ink-faint:#7d6d6d;
      --line:#372a2a; --line-strong:#513c3d;
      --accent:#e08795; --accent-soft:#3e1e21; --accent-ink:#130808;
      --danger:#df7f78; --danger-soft:#351c1a;
      --ok:#75ae81; --ok-soft:#102515;
      --warn:#e0b45a; --warn-soft:#3a2f14;
      --tile-blue:#26304a; --tile-green:#22392a; --tile-orange:#3f2d1e; --tile-purple:#33283f; --tile-yellow:#3d341a; --tile-gray:#332e28; --tile-red:#3f2424;
      color-scheme: dark;
    }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:var(--font-sans); font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%; }
  a{ color:inherit; text-decoration:none; }
  button{ font:inherit; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 16px 96px; }
  .loading{ padding:60px 0; text-align:center; color:var(--ink-faint); }

  .topbar{ display:flex; align-items:center; gap:10px; padding:14px 0 10px; position:sticky; top:0; background:var(--paper); z-index:5; }
  .topbar h1{ font-family:var(--font-serif); font-size:21px; margin:0; flex:1; font-weight:700; }
  .topbar .back{ border:0; background:transparent; font-size:22px; padding:4px 8px 4px 0; color:var(--ink-soft); cursor:pointer; }
  .who{ font-size:13px; color:var(--ink-soft); background:var(--surface-sunken); border-radius:999px; padding:4px 10px; border:1px solid var(--line); cursor:pointer; white-space:nowrap; }

  .group-title{ font-size:14px; color:var(--ink-soft); margin:18px 4px 8px; font-weight:500; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); box-shadow:var(--shadow); overflow:hidden; }
  .row{ display:flex; align-items:center; gap:14px; padding:14px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row:last-child{ border-bottom:0; }
  .row:active{ background:var(--surface-sunken); }
  .row.disabled{ opacity:.55; }
  .tile{ width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:24px; flex:none; }
  .rt{ flex:1; min-width:0; }
  .rtitle{ font-weight:600; font-size:17px; font-family:var(--font-serif); }
  .rsub{ font-size:13px; color:var(--ink-soft); }
  .chev{ color:var(--ink-faint); font-size:20px; }
  .badge{ font-size:12px; padding:2px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:600; white-space:nowrap; }
  .badge.danger{ background:var(--danger-soft); color:var(--danger); }
  .badge.ok{ background:var(--ok-soft); color:var(--ok); }
  .badge.warn{ background:var(--warn-soft); color:var(--warn); }
  .badge.muted{ background:var(--surface-sunken); color:var(--ink-soft); }
  .docchips .badge{ min-width:20px; text-align:center; margin-right:4px; padding:2px 6px; }

  .summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .summary a{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:10px 8px; text-align:center; }
  .summary .n{ font-size:24px; font-weight:700; line-height:1.1; }
  .summary .n.danger{ color:var(--danger); }
  .summary .l{ font-size:12px; color:var(--ink-soft); }
  .daystrip{ display:flex; gap:6px; overflow-x:auto; margin-top:8px; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
  .daypill{ flex:none; min-width:58px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:6px 4px; text-align:center; }
  .daypill.today{ border-color:var(--accent); background:var(--accent-soft); }
  .daypill .dp-d{ font-size:11px; color:var(--ink-soft); margin-bottom:2px; }
  .daypill .dp-v{ font-size:12px; font-weight:700; line-height:1.2; }
  .daypill .dp-v.zero{ color:var(--ink-faint); font-weight:400; }
  .daypill .dp-n{ font-size:10px; color:var(--ink-faint); margin-top:1px; }

  .section{ margin-top:16px; }
  .sec-h{ display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--surface-sunken); font-weight:600; font-size:14px; border-bottom:1px solid var(--line); }
  .sec-h .sp{ flex:1; }
  .item{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); }
  .item:last-child{ border-bottom:0; }
  .iname{ flex:1; min-width:0; }
  .iname .t{ font-weight:500; }
  .iname .s{ font-size:12px; color:var(--ink-soft); }
  .iname .s.warn{ color:var(--warn); }
  .qty{ width:76px; padding:8px 6px; border:1px solid var(--line-strong); border-radius:var(--radius-s); font-size:17px; text-align:center; background:var(--surface); color:var(--ink); }
  .qty:focus{ outline:2px solid var(--accent); border-color:transparent; }
  .qty.filled{ background:var(--ok-soft); }
  .unit{ font-size:13px; color:var(--ink-soft); width:34px; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 18px; border-radius:999px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-weight:600; cursor:pointer; font-size:15px; }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn.danger{ background:var(--danger-soft); color:var(--danger); border-color:transparent; }
  .btn.ok{ background:var(--ok-soft); color:var(--ok); border-color:transparent; }
  .btn.sm{ padding:6px 12px; font-size:13px; border-radius:999px; }
  .btn.block{ width:100%; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .stickybar{ position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:var(--paper); border-top:1px solid var(--line); z-index:6; }
  .stickybar .inner{ max-width:560px; margin:0 auto; display:flex; gap:8px; }

  .form{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); padding:14px 16px; display:grid; gap:10px; }
  .form label{ font-size:13px; color:var(--ink-soft); display:block; margin-bottom:4px; }
  .in, select.in{ width:100%; padding:10px 12px; border:1px solid var(--line-strong); border-radius:var(--radius-s); font-size:16px; background:var(--surface); color:var(--ink); }
  .in:focus{ outline:2px solid var(--accent); border-color:transparent; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .inline{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .muted{ color:var(--ink-soft); font-size:13px; }
  .empty{ padding:24px 16px; text-align:center; color:var(--ink-faint); font-size:14px; }
  .note{ background:var(--warn-soft); color:var(--warn); border-radius:var(--radius-m); padding:10px 14px; font-size:13px; margin-top:12px; }
  .note.danger{ background:var(--danger-soft); color:var(--danger); }
  .note.ok{ background:var(--ok-soft); color:var(--ok); }

  .tabs{ display:flex; gap:6px; overflow-x:auto; padding:4px 0 8px; }
  .tab{ padding:7px 14px; border-radius:999px; border:1px solid var(--line-strong); background:var(--surface); font-size:14px; white-space:nowrap; cursor:pointer; }
  .tab.on{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  .pin-wrap{ text-align:center; padding:20px 0; }
  .pin{ font-size:32px; letter-spacing:14px; width:200px; text-align:center; padding:10px; border:1px solid var(--line-strong); border-radius:var(--radius-m); background:var(--surface); color:var(--ink); }
  .pin:focus{ outline:2px solid var(--accent); }
  .name-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .name-grid .btn{ padding:14px 8px; font-size:16px; }
  .expand{ padding:10px 14px 14px 72px; background:var(--surface-sunken); border-bottom:1px solid var(--line); }

  .toast{ position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:999px; font-size:14px; opacity:0; transition:.2s; pointer-events:none; z-index:20; max-width:90vw; text-align:center; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .hist{ font-size:13px; color:var(--ink-soft); padding:8px 14px; border-bottom:1px solid var(--line); display:flex; gap:8px; }
  .hist:last-child{ border-bottom:0; }
  .hist .sp{ flex:1; }
  .hidden{ display:none !important; }
  .sigpad{ width:100%; height:170px; border:1px dashed var(--line-strong); border-radius:var(--radius-m); background:#fff; touch-action:none; display:block; }
  .sigprev{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-m); padding:6px; text-align:center; }
  .sigprev img{ height:60px; }
  .docview{ background:#fff; color:#111; border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden; }
  .docview .bnd .page{ width:auto !important; min-height:0 !important; padding:14px 12px !important; page-break-after:auto !important; border-bottom:1px dashed #ccc; }
  .docview .bnd .page:last-child{ border-bottom:0; }
  .docview .bnd{ font-size:13.5px !important; }
  .docview .bnd h1{ font-size:19px !important; letter-spacing:3px !important; }
  .docview .bnd table{ font-size:12px !important; }
  .chk{ display:flex; gap:10px; align-items:flex-start; padding:10px 14px; border-bottom:1px solid var(--line); font-size:15px; cursor:pointer; }
  .chk:last-child{ border-bottom:0; }
  .chk input{ width:22px; height:22px; flex:none; margin-top:1px; }
  .steps{ display:flex; gap:4px; margin:4px 4px 10px; }
  .steps span{ flex:1; height:5px; border-radius:3px; background:var(--line); }
  .steps span.on{ background:var(--accent); }
  .steps span.done{ background:var(--ok); }
  table.grid{ border-collapse:collapse; font-size:11px; min-width:100%; }
  table.grid th, table.grid td{ border:1px solid var(--line); padding:2px 3px; vertical-align:top; min-width:60px; }
  table.grid th{ background:var(--surface-sunken); font-weight:500; color:var(--ink-soft); position:sticky; left:0; }
  table.grid th:first-child{ min-width:44px; z-index:1; }
  table.grid .on{ background:var(--accent-soft); }
  table.pptable{ border-collapse:collapse; width:100%; font-size:13px; }
  table.pptable th, table.pptable td{ padding:8px 10px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  table.pptable th{ color:var(--ink-soft); font-weight:500; background:var(--surface-sunken); }
  table.pptable td:first-child, table.pptable th:first-child{ text-align:left; }
  table.pptable tr.tot td{ font-weight:700; background:var(--surface-sunken); }
  .chip{ display:inline-block; padding:0 4px; margin:1px; border-radius:4px; background:var(--tile-gray); color:#2b2420; white-space:nowrap; }
  .chip.sub{ outline:2px solid var(--accent); outline-offset:-1px; font-weight:600; }
  .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; border:1px solid rgba(0,0,0,.15); }
  .chip.covering{ background:var(--warn-soft); color:var(--warn); }
  .chip.work{ background:var(--ok-soft); color:var(--ok); }
  .chip.brk{ background:var(--danger-soft); color:var(--danger); font-weight:600; border:1px solid var(--danger); }
  .chip.requested{ background:var(--tile-gray); color:var(--ink-faint); }
  textarea.in{ font-family:inherit; }
  .slip{ background:#fff; color:#111; border:1px solid var(--line); border-radius:var(--radius-m); padding:16px; }
  .slip h2{ text-align:center; margin:0 0 12px; font-size:20px; }
  .slip-meta{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:10px; }
  .slip-t{ width:100%; border-collapse:collapse; margin-bottom:12px; font-size:13px; }
  .slip-t th, .slip-t td{ border:1px solid #bbb; padding:6px 8px; text-align:left; }
  .slip-t th{ background:#f2f2f2; font-weight:600; }
  .slip-t td.r{ text-align:right; }
  @media print{ body{ background:#fff; } .noprint, .topbar, .stickybar, .toast{ display:none !important; } .wrap{ max-width:none; padding:0; } .slip{ border:0; } }
  @media (min-width:900px){ .wrap{ max-width:1100px; } .stickybar .inner{ max-width:1100px; } }
  code{ background:var(--surface-sunken); padding:1px 4px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<div id="app" class="wrap"><div class="loading">불러오는 중…</div></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="docs-templates.js"></script>
<script>
(function(){
  'use strict';

  // ===== 설정 =====
  // 매뉴얼북·로그북과 같은 Supabase 프로젝트를 씁니다 (테이블만 추가). anon/publishable 키는 공개되어도 되는 값.
  var SUPABASE_URL = 'https://caetlljnyxsusswqhtci.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_Oiqo2urdo-9s-HIso3rkmQ_7pP-I0nV';
  var LINKS = { manual: 'https://manual.bonnoel.com', logbook: 'https://logbook.bonnoel.com',
    hiring: 'https://hiring.bonnoel.com/', hiringAdmin: 'https://hiring.bonnoel.com/#admin', hiringWelcome: 'https://hiring.bonnoel.com/#welcome' };
  var DEMO = /[?&]demo=1/.test(location.search);   // ?demo=1 : 창고 없이 가짜 데이터로 눌러보기

  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function uid(){ return 'x' + Math.random().toString(36).slice(2) + Date.now().toString(36); }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function addDays(dateStr, n){ var d = new Date(dateStr + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function md(s){ if(!s) return ''; var d = new Date(s); if (isNaN(d)) return ''; return (d.getMonth()+1) + '/' + d.getDate(); }
  function isToday(s){ if (!s) return false; var d = new Date(s); if (isNaN(d)) return false; var t = new Date(); return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth() && d.getDate() === t.getDate(); }
  function localDateKey(s){ var d = new Date(s); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function num(v){ var n = parseFloat(v); return isNaN(n) ? null : n; }
  function fmtQ(n){ if (n == null) return '-'; return (Math.round(n * 100) / 100).toString(); }
  function daysAgo(n){ var d = new Date(); d.setDate(d.getDate() - n); return d.toISOString(); }

  // ===== 데이터 창고 어댑터 =====
  var db = null;

  function makeSupabaseDb(sb){
    function applyMatch(q, opt){
      if (!opt) return q;
      var k;
      if (opt.eq) for (k in opt.eq) q = q.eq(k, opt.eq[k]);
      if (opt.in) for (k in opt.in) q = q.in(k, opt.in[k]);
      if (opt.gte) for (k in opt.gte) q = q.gte(k, opt.gte[k]);
      if (opt.is) for (k in opt.is) q = q.is(k, opt.is[k]);
      return q;
    }
    return {
      select: async function(table, opt){
        var q = sb.from(table).select('*');
        q = applyMatch(q, opt);
        if (opt && opt.order) q = q.order(opt.order.col, { ascending: opt.order.asc !== false });
        if (opt && opt.limit) q = q.limit(opt.limit);
        var r = await q; if (r.error) throw r.error; return r.data || [];
      },
      insert: async function(table, rows){ var r = await sb.from(table).insert(rows).select(); if (r.error) throw r.error; return r.data; },
      update: async function(table, match, patch){ var q = sb.from(table).update(patch); q = applyMatch(q, { eq: match }); var r = await q.select(); if (r.error) throw r.error; return r.data; },
      upsert: async function(table, rows, onConflict){ var r = await sb.from(table).upsert(rows, { onConflict: onConflict }).select(); if (r.error) throw r.error; return r.data; },
      remove: async function(table, match){ var q = sb.from(table).delete(); q = applyMatch(q, { eq: match }); var r = await q; if (r.error) throw r.error; },
      rpc: async function(fn, args){ var r = await sb.rpc(fn, args || {}); if (r.error){ if (/Could not find the function|does not exist/i.test(r.error.message || '')) throw new Error('선결제 준비(SQL)가 아직 안 됐어요 — supabase-migration-prepay.sql 실행 필요'); throw r.error; } return r.data; },
      // 영수증 사진 저장소 + 자동 읽기 함수
      upload: async function(bucket, path, blob, type){ var r = await sb.storage.from(bucket).upload(path, blob, { contentType: type, upsert: false }); if (r.error) throw r.error; return path; },
      signedUrl: async function(bucket, path){ var r = await sb.storage.from(bucket).createSignedUrl(path, 3600); if (r.error) throw r.error; return r.data.signedUrl; },
      removeFile: async function(bucket, path){ var r = await sb.storage.from(bucket).remove([path]); if (r.error) throw r.error; },
      ocr: async function(b64, mime, kind){
        var res = await fetch(SUPABASE_URL + '/functions/v1/read-receipt', { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }, body: JSON.stringify({ image_base64: b64, media_type: mime, kind: kind || 'expense' }) });
        var j = null; try { j = await res.json(); } catch(e){}
        if (!res.ok) throw new Error((j && j.error) || (res.status === 404 ? '자동 읽기 함수(read-receipt)가 아직 배포되지 않았어요' : '서버 응답 ' + res.status));
        return j;
      },
      // 입사 서류 PDF 메일 발송 함수
      sendDocs: async function(batchId){
        var res = await fetch(SUPABASE_URL + '/functions/v1/send-document', { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }, body: JSON.stringify({ batch_id: batchId, ua: navigator.userAgent.slice(0, 300) }) });
        var j = null; try { j = await res.json(); } catch(e){}
        if (!res.ok) throw new Error((j && j.error) || (res.status === 404 ? '메일 발송 함수(send-document)가 아직 배포되지 않았어요' : '서버 응답 ' + res.status));
        return j;
      },

  function makeMemoryDb(tables){
    function match(row, opt){
      if (!opt) return true;
      var k;
      if (opt.eq) for (k in opt.eq) if (row[k] !== opt.eq[k]) return false;
      if (opt.in) for (k in opt.in) if (opt.in[k].indexOf(row[k]) < 0) return false;
      if (opt.gte) for (k in opt.gte) if (!(row[k] >= opt.gte[k])) return false;
      if (opt.is) for (k in opt.is) if (row[k] !== opt.is[k]) return false;
      return true;
    }
    function clone(x){ return JSON.parse(JSON.stringify(x)); }
    return {
      select: async function(table, opt){
        var rows = (tables[table] || []).filter(function(r){ return match(r, opt); });
        if (opt && opt.order){ var c = opt.order.col, asc = opt.order.asc !== false; rows.sort(function(a,b){ return (a[c] > b[c] ? 1 : a[c] < b[c] ? -1 : 0) * (asc ? 1 : -1); }); }
        if (opt && opt.limit) rows = rows.slice(0, opt.limit);
        return clone(rows);
      },
      insert: async function(table, rows){ rows = Array.isArray(rows) ? rows : [rows]; tables[table] = tables[table] || []; var out = rows.map(function(r){ var x = Object.assign({ id: uid(), created_at: new Date().toISOString() }, r); tables[table].push(x); return x; }); return clone(out); },
      update: async function(table, m, patch){ var out = []; (tables[table] || []).forEach(function(r){ if (match(r, { eq: m })) { Object.assign(r, patch); out.push(r); } }); return clone(out); },
      upsert: async function(table, rows, onConflict){ var keys = (onConflict || 'id').split(','); tables[table] = tables[table] || []; rows.forEach(function(r){ var hit = tables[table].filter(function(x){ return keys.every(function(k){ return x[k] === r[k]; }); })[0]; if (hit) Object.assign(hit, r); else tables[table].push(Object.assign({ id: uid() }, r)); }); return clone(rows); },
      remove: async function(table, m){ tables[table] = (tables[table] || []).filter(function(r){ return !match(r, { eq: m }); }); },
      rpc: async function(fn, args){ return clone(ppMemRpc(tables, fn, args || {})); },
      upload: async function(bucket, path, blob, type){ tables.__files = tables.__files || {}; tables.__files[path] = blob; return path; },
      signedUrl: async function(bucket, path){ var f = (tables.__files || {})[path]; if (!f) throw new Error('시연 모드라 저장된 사진이 없어요'); return URL.createObjectURL(f); },
      removeFile: async function(){},
      ocr: async function(b64, mime, kind){ await new Promise(function(r){ setTimeout(r, 900); }); if (kind === 'staff_purchase') return { ok: true, bought_on: todayStr(), list_total: 5500, discount: 1100, paid: 4400, pay_method: '카드', cash_receipt: false, branch: '중계점', items: '(시연) 버터프레첼 1개', confidence: 0.9 }; return { ok: true, merchant: '(시연) 성수 식자재마트', spent_on: todayStr(), amount: 34500, card_last4: '1234', summary: '시연 모드라 가짜로 읽었어요', confidence: 0.9 }; },
      sendDocs: async function(batchId){ await new Promise(function(r){ setTimeout(r, 800); }); var to = ''; (tables.ops_documents || []).forEach(function(r){ if (r.batch_id === batchId && r.pdf_path && ['signed','failed','sent'].indexOf(r.status) >= 0){ to = r.email_to || to; r.status = 'sent'; r.email_sent_at = new Date().toISOString(); r.email_cc = '(시연) 사장님 메일'; r.signed_ip = '127.0.0.1'; } }); return { ok: true, sent_to: to, cc: '(시연) 사장님 메일' }; },
      sendPayslip: async function(runId, to){ await new Promise(function(r){ setTimeout(r, 800); }); (tables.ops_pay_runs || []).forEach(function(r){ if (r.id === runId){ r.email_to = to; r.email_sent_at = new Date().toISOString(); r.email_error = null; } }); return { ok: true, sent_to: to }; }

  function itemsForBranch(branchId){
    var map = {};
    base.itemBranch.forEach(function(ib){ if (ib.branch_id === branchId) map[ib.item_id] = ib; });
    return base.items.filter(function(it){ return it.active !== false && map[it.id] && map[it.id].active !== false; })
      .map(function(it){ return { item: it, target: num(map[it.id].target_qty) || 0 }; });
  }
  function groupByCategory(list){ // list: [{item,...}]

  // ===== 재고 계산 =====
  // 추정 현재고 = 마지막 체크 수량 + 그 뒤 도착한 주문 + 그 뒤 받은 이동 − 그 뒤 보낸 이동
  async function loadStock(branchIds){
    var since = daysAgo(120);
    var r = await Promise.all([
      db.select('ops_stock_checks', { in: { branch_id: branchIds }, gte: { checked_at: since }, order: { col: 'checked_at', asc: false } }),
      db.select('ops_orders', { in: { branch_id: branchIds }, gte: { ordered_at: since } }),
      db.select('ops_transfers', { gte: { created_at: since } })
    ]);
    var checks = r[0], orders = r[1], transfers = r[2];
    var out = {};
    branchIds.forEach(function(b){
      var latest = {};
      checks.forEach(function(c){ if (c.branch_id === b && !latest[c.item_id]) latest[c.item_id] = c; });
      var m = {};
      itemsForBranch(b).forEach(function(x){
        var it = x.item, last = latest[it.id] || null;
        var est = last ? num(last.qty) : null;
        var pending = 0, pendingList = [];
        orders.forEach(function(o){
          if (o.branch_id !== b || o.item_id !== it.id) return;
          if (o.status === 'ordered'){ pending += num(o.qty) || 0; pendingList.push({ kind: 'order', qty: num(o.qty), eta: o.eta_date, id: o.id }); }
          else if (o.status === 'received' && last && o.received_at > last.checked_at && est != null) est += num(o.received_qty) || 0;
        });
        transfers.forEach(function(t){
          if (t.item_id !== it.id) return;
          if (t.to_branch === b){
            if (!t.received_at){ pending += num(t.qty) || 0; pendingList.push({ kind: 'transfer', qty: num(t.qty), from: t.from_branch, id: t.id }); }
            else if (last && t.received_at > last.checked_at && est != null) est += num(t.received_qty) || 0;
          }
          if (t.from_branch === b && last && t.created_at > last.checked_at && est != null) est -= num(t.qty) || 0;
        });
        if (est != null && est < 0) est = 0;   // 보낸 게 종이 재고보다 많으면 0으로 봄
        var shortage = (est != null && x.target > 0 && !it.unlimited && !(last && last.unlimited)) ? Math.max(0, x.target - est - pending) : 0;
        m[it.id] = { item: it, target: x.target, last: last, est: est, pending: pending, pendingList: pendingList, shortage: shortage };
      });
      out[b] = m;
    });
    return { byBranch: out, orders: orders, transfers: transfers };
  }

    var n = app.querySelectorAll('.qty.filled').length + app.querySelectorAll('.qty-unlimited:checked').length;
    c.textContent = '(' + n + '/' + (app._checkTotal || 0) + ')';

  async function saveCheck(b){
    var chkSel = document.getElementById('chk-staff');
    var staffId = (isOwner() && chkSel && chkSel.value) || session.staffId;
    var rows = [];
    app.querySelectorAll('.qty').forEach(function(inp){
      var itemId = inp.getAttribute('data-item');
      var cb = app.querySelector('.qty-unlimited[data-item="' + itemId + '"]');
      var unlimited = cb ? cb.checked : false;
      var origUnlimited = cb ? cb.getAttribute('data-orig') === '1' : false;
      if (unlimited){
        if (origUnlimited) return;   // 오늘 이미 α(충분)로 기록됨
        rows.push({ branch_id: b, item_id: itemId, qty: 0, unlimited: true, staff_id: staffId, checked_at: new Date().toISOString() });
        return;
      }
      var v = num(inp.value); if (v == null || inp.value === '') return;
      var orig = inp.getAttribute('data-orig'); var origNum = (orig && !origUnlimited) ? num(orig) : null;
      if (origNum != null && v === origNum) return;   // 오늘 이미 이 값으로 기록됨 · 다시 안 넣어도 돼요
      rows.push({ branch_id: b, item_id: itemId, qty: v, unlimited: false, staff_id: staffId, checked_at: new Date().toISOString() });
    });
    if (!rows.length){ toast('새로 넣거나 바뀐 수량이 없어요'); return; }
    await db.insert('ops_stock_checks', rows);
    toast(rows.length + '개 저장했어요');
    nav('#/home');
  }

  function copyResolved(b){
    var st = app._stock; if (!st) return;
    var m = st.byBranch[b];
    var byBranch = {}, branchOrder = [], orderLines = [], noteLines = [];
    for (var k in m){
      var s = m[k];
      if (s.item.note){ noteLines.push(s.item.name + ': ' + s.item.note); continue; }
      if (s.pending > 0){

  // 이미 이 주 전용 표가 있으면 아무 것도 안 함.
  async function ensureWeeklyPool(branchId, week){
    var weekly = await db.select('ops_shift_patterns', { eq: { branch_id: branchId, week_start: week, active: true } });
    if (weekly.length) return;
    var fixed = (await db.select('ops_shift_patterns', { eq: { branch_id: branchId, active: true } })).filter(function(p){ return !p.week_start; });
    if (fixed.length) await db.insert('ops_shift_patterns', fixed.map(function(p){ return { staff_id: p.staff_id, branch_id: branchId, weekday: p.weekday, start_time: p.start_time, end_time: p.end_time, break_start: p.break_start, break_end: p.break_end, active: true, week_start: week }; }));

    if ((bs && !be) || (!bs && be)){ toast('휴게는 시작·끝 둘 다 넣어 주세요'); return; }
    var week = weekStart(date);
    await ensureWeeklyPool(branchId, week);

  async function addShift(branchId, date, weekday){
    var staffId = document.getElementById('as-staff').value;
    var st = document.getElementById('as-start').value, en = document.getElementById('as-end').value;

    if ((bs && !be) || (!bs && be)){ toast('휴게는 시작·끝 둘 다 넣어 주세요'); return; }
    var week = weekStart(date);
    await ensureWeeklyPool(branchId, week);
    // 같은 사람이 그 날 이미 근무가 있으면 겹쳐 쌓지 않고 새 시간으로 바꿔치기 (중복 방지)
    await db.update('ops_shift_patterns', { branch_id: branchId, week_start: week, staff_id: staffId, weekday: weekday, active: true }, { active: false });
    await db.insert('ops_shift_patterns', { staff_id: staffId, branch_id: branchId, weekday: weekday, start_time: st, end_time: en, break_start: bs, break_end: be, active: true, week_start: week, note: nt });

  // 시간표의 빈 칸을 눌러서 바로 사람 넣기 (일단 4시간짜리로 넣고, 시간은 나중에 "바꾸기"로 조정)
  async function chipAddShift(branchId, date, weekday, startTime, staffId, endTime){
    var week = weekStart(date);
    endTime = endTime || fromMin(Math.min(23 * 60 + 30, toMin(startTime) + 30));
    await ensureWeeklyPool(branchId, week);
    // 겹치거나 붙어있는 기존 근무가 있으면 이어붙이고(합쳐서 하나로), 없으면 새 칸만 따로 추가
    var existing = await db.select('ops_shift_patterns', { eq: { branch_id: branchId, week_start: week, staff_id: staffId, weekday: weekday, active: true } });
    var ns = toMin(startTime), ne = toMin(endTime);
    var overlap = existing.filter(function(p){ return toMin(p.start_time) <= ne && ns <= toMin(p.end_time); });
    overlap.forEach(function(p){ ns = Math.min(ns, toMin(p.start_time)); ne = Math.max(ne, toMin(p.end_time)); });
    for (var i = 0; i < overlap.length; i++){ await db.update('ops_shift_patterns', { id: overlap[i].id }, { active: false }); }
    var finalStart = fromMin(ns), finalEnd = fromMin(ne);
    await db.insert('ops_shift_patterns', { staff_id: staffId, branch_id: branchId, weekday: weekday, start_time: finalStart, end_time: finalEnd, active: true, week_start: week });
    toast(staffName(staffId) + ' ' + finalStart + '~' + finalEnd + '로 반영했어요'); render();
  }
  // 근무 한 칸(30분)만 지우기: 앞/뒤 끝이면 시간만 줄이고, 중간이면 둘로 쪼개고, 딱 그 칸뿐이면 통째로 지움
  async function chipDeleteSlot(patternId, slotStart, slotEnd){
    var rows = await db.select('ops_shift_patterns', { eq: { id: patternId } });
    var p = rows[0]; if (!p){ return; }
    var s = toMin(p.start_time), e = toMin(p.end_time), rs = toMin(slotStart), re = toMin(slotEnd);
    // 휴게가 지워지는 범위 밖에 그대로 남아있으면 휴게는 유지, 걸치면 휴게도 같이 없앰
    function keepBreak(newS, newE){
      if (!p.break_start) return { break_start: null, break_end: null };
      var bs = toMin(p.break_start), be = toMin(p.break_end);
      return (bs >= newS && be <= newE) ? { break_start: p.break_start, break_end: p.break_end } : { break_start: null, break_end: null };
    }
    if (rs <= s && re >= e){
      await db.update('ops_shift_patterns', { id: patternId }, { active: false });
    } else if (rs <= s){
      await db.update('ops_shift_patterns', { id: patternId }, Object.assign({ start_time: slotEnd }, keepBreak(re, e)));
    } else if (re >= e){
      await db.update('ops_shift_patterns', { id: patternId }, Object.assign({ end_time: slotStart }, keepBreak(s, rs)));
    } else {
      await db.update('ops_shift_patterns', { id: patternId }, Object.assign({ end_time: slotStart }, keepBreak(s, rs)));
      await db.insert('ops_shift_patterns', { staff_id: p.staff_id, branch_id: p.branch_id, weekday: p.weekday, start_time: slotEnd, end_time: p.end_time, active: true, week_start: p.week_start });
    }
    toast(slotStart + '~' + slotEnd + ' 지웠어요'); render();
  }

    var wasFilled = x.edits && x.edits[0] && x.edits[0].field === '채움';

    else t += hm(x.clock_in) + ' ~ ' + hm(x.clock_out);
    if (!n) return t + bad('퇴근 없음');
    t += ' · 인정 <b>' + fmtH(n.net) + '</b>' + (n.brk ? ' (휴게 ' + n.brk + '분 뺌)' : '') + (n.night ? ' · 야간 ' + n.night + '분' : '');
    if (n.late) t += bad('지각 ' + n.late + '분 뺌');
    if (n.early) t += ' · <span style="color:#E65100">조기 퇴근 ' + n.early + '분</span>';
    if (n.sched && !x.clock_out) t += ' · <span class="muted">퇴근 안 누름</span>';

    return t;
  }
  function suspectOver(x){ // 실제가 근무표보다 30분 이상 긴데 추가 근무를 하나도 안 올린 기록
    if ((x._extras || []).length || x.fill_status || !x.clock_in || !x.clock_out) return false;
    if (x.no_schedule) return minutesBetween(x.clock_in, x.clock_out) >= 30;
    if (!x.sched_start) return false;
    var a = attInfo(x), over = Math.max(0, (new Date(a.ss) - new Date(x.clock_in)) / 60000) + Math.max(0, (new Date(x.clock_out) - new Date(a.se)) / 60000);
    return over >= 30;
  }

  // 폰 사진(3~5MB)을 긴 쪽 1600px JPEG로 줄임 (저장 용량·자동 읽기 비용 절약)
  function resizeImage(file, max){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file); var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        var dataUrl = c.toDataURL('image/jpeg', 0.85);
        c.toBlob(function(blob){ if (!blob) return reject(new Error('사진을 변환하지 못했어요')); resolve({ blob: blob, dataUrl: dataUrl, mime: 'image/jpeg' }); }, 'image/jpeg', 0.85);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('사진을 열 수 없어요')); };
      img.src = url;
    });
  }

    var y = +d.slice(0, 4), m = +d.slice(4, 6), day = +d.slice(6, 8);

  async function buyUpdate(id){
    var g = function(p){ return document.getElementById(p + '-' + id).value; };
    var method = buyMethod(g('bm')); var list = num(g('bl')), disc = num(g('bc')), paid = num(g('bp'));
    if (!g('bd')){ toast('날짜를 넣어 주세요'); return; }
    if (!list || list <= 0){ toast('정가를 넣어 주세요'); return; }
    var typedName = g('bn').trim();
    if (!typedName){ toast('구매한 사람 이름을 넣어 주세요'); return; }
    if (disc == null) disc = Math.round(list * method.rate / 100);
    if (paid == null) paid = list - disc;
    var match = base.staff.filter(function(s){ return s.active !== false && s.name === typedName; })[0];
    await db.update('ops_staff_purchases', { id: id }, { bought_on: g('bd'), branch_id: g('bb') || null, staff_id: match ? match.id : null, buyer_name: typedName, pay_method: method.id, discount_rate: method.rate, list_total: list, discount: disc, paid: paid, items: g('bi').trim() || null, memo: g('bo').trim() || null, updated_at: nowIso() });
    toast('고쳤어요 · ' + typedName); render();
  }

  // ===== 이벤트 =====
  // ===== 8차: 보건증 만료 관리 (supabase-migration-health.sql) =====
  // 규칙: 만료·30일 이내·보건증 없음 = 빨강, 60일 이내 = 노랑. 직원이 새 사진 올리면 '제출', 매니저가 날짜 확인하면 '완료'.
  var HC_BUCKET = 'documents', HC_RED = 30, HC_YELLOW = 60;
  var hcState = { photo: null, open: {} };
  var hcAdminPhoto = {};   // 사장님이 직원 대신 올릴 사진 (제출 전 임시 보관, staffId별)
  async function loadHealth(){ return await db.select('ops_health_certs', { order: { col: 'created_at', asc: false } }); }
  function healthMap(rows){
    var m = {};
    rows.forEach(function(r){
      var x = m[r.staff_id] || (m[r.staff_id] = { confirmed: null, pending: null, rows: [] });
      x.rows.push(r);
      if (r.status === 'submitted'){ if (!x.pending) x.pending = r; }
      else if (r.status === 'confirmed' && r.expires_on){ if (!x.confirmed || r.expires_on > x.confirmed.expires_on) x.confirmed = r; }
    });
    return m;
  }
  function healthStatus(info){
    var c = info && info.confirmed;
    if (!c) return { level: 'danger', days: null, label: '보건증 없음', short: '없음' };
    var days = Math.round((dateObj(c.expires_on) - dateObj(todayStr())) / 86400000);
    if (days < 0) return { level: 'danger', days: days, label: '만료됨 · ' + (-days) + '일 지남', short: '만료' };
    if (days <= HC_RED) return { level: 'danger', days: days, label: days + '일 남음', short: 'D-' + days };
    if (days <= HC_YELLOW) return { level: 'warn', days: days, label: days + '일 남음', short: 'D-' + days };
    return { level: 'ok', days: days, label: days + '일 남음', short: '' };
  }
  function healthBadge(info){
    var st = healthStatus(info);
    var html = '<span class="badge ' + st.level + '">' + esc(st.level === 'ok' ? '정상' : st.label) + '</span>';
    if (info && info.pending) html += ' <span class="badge">제출 · 확인 대기</span>';
    return html;
  }
  function hcSortKey(info){ var st = healthStatus(info); return (st.level === 'danger' ? 0 : st.level === 'warn' ? 1 : 2) * 100000 + (st.days == null ? 0 : st.days + 1); }
  function fmtYmdK(s){ return s ? s.replace(/-/g, '.') : '—'; }
  // 이름표에 붙일 빨간 글씨 (로그인·매장폰). 테이블이 아직 없으면 조용히 빈 값.
  async function hcRedMarks(){
    var out = {};
    try { var map = healthMap(await loadHealth()); base.staff.forEach(function(s){ if (s.active === false) return; var st = healthStatus(map[s.id]); if (st.level === 'danger' && !(map[s.id] && map[s.id].pending)) out[s.id] = st.short; }); } catch(e){}
    return out;
  }
  function hcNameMark(marks, id){ return marks[id] ? '<br><span style="font-size:12px;font-weight:400;color:var(--danger)">보건증 ' + esc(marks[id]) + '</span>' : ''; }
  function hcSourceName(src){ return src === 'sheet' ? '시트' : src === 'manual' ? '직접 입력' : '사진 제출'; }
  function hcHistory(rows, canDelete){
    if (!rows.length) return '<div class="empty">기록이 없어요</div>';
    return rows.map(function(r){
      return '<div class="item"><div class="iname"><div class="t">' + (r.status === 'submitted' ? '제출 · 확인 대기' : '만료 ' + esc(fmtYmdK(r.expires_on))) + '</div><div class="s">' + esc(fmtDT(r.created_at)) + ' · ' + hcSourceName(r.source) + (r.memo ? ' · ' + esc(r.memo) : '') + '</div></div><span class="inline">' +
        (r.photo_path ? '<button class="btn sm" data-act="hc-photo" data-path="' + esc(r.photo_path) + '">사진</button>' : '') +
        (canDelete ? '<button class="btn sm danger" data-act="hc-del" data-id="' + esc(r.id) + '" data-path="' + esc(r.photo_path || '') + '">지움</button>' : '') + '</span></div>';
    }).join('');
  }

  // --- 보건증 관리 (사장님·매니저): 급한 순서 목록 · 제출 확인(완료) · 날짜 직접 입력 · 시트 붙여넣기 ---

  var rsState = { importText: '', importRows: null };

    var colName = -1, colExp = -1, colBranch = -1, colHire = -1, colLeave = -1, colEmail = -1, out = [];
    text.split(/\r?\n/).forEach(function(line){
      var cells = line.split('\t').map(function(c){ return c.trim(); });
      if (cells.length < 2) return;
      var hi = -1; cells.forEach(function(c, i){ if (hi < 0 && /보건증/.test(c)) hi = i; });
      if (hi >= 0 && cells.indexOf('이름') >= 0){
        colExp = hi; colName = cells.indexOf('이름'); colBranch = cells.indexOf('지점');
        colHire = -1; colLeave = -1; colEmail = -1;
        cells.forEach(function(c, i){ if (colHire < 0 && /입사/.test(c)) colHire = i; if (colLeave < 0 && /퇴사/.test(c)) colLeave = i; if (colEmail < 0 && /이메일|메일/.test(c)) colEmail = i; });
        return;   // 머리글 줄
      }
      var bi = -1, br = null;
      if (colBranch >= 0){ br = hcBranchByName(cells[colBranch]); if (br) bi = colBranch; }
      if (!br) for (var i = 0; i < cells.length; i++){ var b = hcBranchByName(cells[i]); if (b){ br = b; bi = i; break; } }
      if (!br) return;   // "예시)" 줄, 빈 줄, 다른 표
      var name = ((colName >= 0 ? cells[colName] : cells[bi + 1]) || '').replace(/\s/g, '');
      if (!/^[가-힣]{2,5}$/.test(name)) return;
      var expCell, hireCell = '', leaveCell = '', emailCell = '';
      if (colExp >= 0){ expCell = cells[colExp]; if (colHire >= 0) hireCell = cells[colHire] || ''; if (colLeave >= 0) leaveCell = cells[colLeave] || ''; if (colEmail >= 0) emailCell = cells[colEmail] || ''; }
      else if (cells.length >= bi + 8){ expCell = cells[bi + 7]; emailCell = cells[bi + 5] || ''; }   // 시트 원래 순서(머리글 없이 복사): 지점·이름·주민번호·입사일·전화·이메일·주소·보건증
      else { var cand = cells.slice(bi + 2).filter(function(c){ return hcParseDate(c); }); expCell = cand.length === 1 ? cand[0] : ''; }

  // ===== 선결제: 손님이 미리 충전해 두고 4매장에서 같이 쓰는 잔액 (supabase-migration-prepay.sql, 기획/선결제_설계.md) =====
  // 돈 장부라서 표를 직접 안 건드리고 prepay_* DB 함수로만 — 매장 코드(6자리)/사장님 코드를 서버가 확인
  // 코드는 이 화면 메모리에만 들고 있음 (새로고침·잠그기 하면 다시 입력)
  var prepaySt = { code: null, role: null, q: '', found: null, act: 'use', status: null, importText: '', importRows: null, usePhoto: null, usePhotoFor: null };
  var PP_KIND = { charge: '충전', use: '사용', refund: '환불', import: '옮김', cancel: '취소' };
  async function ppCall(fn, args){ var r = await db.rpc(fn, args); if (r && r.ok === false) throw new Error(r.error || '실패했어요'); return r; }
  function ppArgs(extra){ return Object.assign({ p_branch: session.branchId, p_code: prepaySt.code }, extra || {}); }
  function ppVal(id){ var el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; }
  function ppDigits(s){ return String(s || '').replace(/[^0-9]/g, ''); }
  function ppPhone(p){ p = String(p || ''); if (p.length === 11) return p.slice(0, 3) + '-' + p.slice(3, 7) + '-' + p.slice(7); if (p.length === 10) return p.slice(0, 3) + '-' + p.slice(3, 6) + '-' + p.slice(6); return p; }
  function ppMasked(p){ p = String(p || ''); return p.length >= 10 ? p.slice(0, 3) + '-****-' + p.slice(-4) : p; }
  function ppBonus(paid){ var s = prepaySt.status || {}; var min = s.bonus_min != null ? s.bonus_min : 100000, rate = s.bonus_rate != null ? +s.bonus_rate : 5; return paid >= min ? Math.floor(paid * rate / 100) : 0; }
  function ppRuleText(){ var s = prepaySt.status || {}; return won(s.bonus_min != null ? s.bonus_min : 100000) + '원 이상 충전하면 ' + (s.bonus_rate != null ? +s.bonus_rate : 5) + '% 추가 적립'; }
  function ppWhen(s){ var d = new Date(s); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function ppSigned(n){ return (n > 0 ? '+' : n < 0 ? '−' : '') + won(Math.abs(n)); }
  function ppPublicUrl(){ return location.origin + location.pathname.replace(/[^/]*$/, '') + 'prepay.html'; }
  // 취소 줄은 원래 무엇(충전·사용…)이었는지로 합산 — 받은 돈·적립·사용·환불
  function ppSums(rows){
    var s = { paid: 0, bonus: 0, use: 0, refund: 0, imported: 0 };
    rows.forEach(function(l){
      var k = l.kind === 'cancel' ? l.orig_kind : l.kind;
      if (k === 'charge'){ s.paid += l.paid; s.bonus += l.bonus; }
      else if (k === 'use') s.use -= l.amount;
      else if (k === 'refund') s.refund -= l.paid;
      else if (k === 'import') s.imported += l.amount;
    });
    return s;
  }
  // 서버 규칙과 같게: 사장님 코드는 전부, 매장 코드는 오늘 우리 매장 충전·사용만 (최종 확인은 서버가 함)
  function ppCanCancel(l){
    if (l.kind === 'cancel' || l.canceled) return false;
    if (prepaySt.role === 'owner') return true;
    return (l.kind === 'charge' || l.kind === 'use') && l.branch_id === session.branchId && localDateKey(l.created_at) === todayStr();
  }
  function ppLedgerRow(l, showWho){
    var kind = l.kind === 'cancel' ? '취소' + (l.orig_kind ? '(' + (PP_KIND[l.orig_kind] || '') + ')' : '') : (PP_KIND[l.kind] || l.kind);
    var cls = l.kind === 'use' || l.kind === 'refund' ? 'danger' : l.kind === 'cancel' ? 'muted' : 'ok';
    var sub = [ppWhen(l.created_at), l.branch_id ? branchName(l.branch_id) : ''];
    if (l.staff_name) sub.push(l.staff_name + (l.by_owner ? '(사장님 코드)' : ''));
    if (l.kind === 'charge' && l.bonus) sub.push('받은 돈 ' + won(l.paid) + ' + 적립 ' + won(l.bonus));
    if (l.kind === 'refund') sub.push('돌려준 돈 ' + won(-l.paid) + (l.bonus ? ' · 적립 ' + won(-l.bonus) + ' 소멸' : ''));
    if (l.memo) sub.push(l.memo);
    var who = showWho ? (l.customer_id ? '<a href="#/prepay-c/' + esc(l.customer_id) + '">' + esc(l.name || '(이름 없음)') + '</a>' : esc(l.name || '')) + ' <span class="muted">' + esc(String(l.phone || '').slice(-4)) + '</span>' : '';
    return '<div class="item"' + (l.canceled ? ' style="opacity:.55"' : '') + '><div class="iname"><div class="t"><span class="badge ' + cls + '">' + esc(kind) + '</span> ' + who + (l.canceled ? ' <span class="badge muted">취소됨</span>' : '') + '</div><div class="s">' + esc(sub.filter(Boolean).join(' · ')) + '</div></div>' +
      '<b style="white-space:nowrap' + (l.canceled ? ';text-decoration:line-through' : '') + '">' + ppSigned(l.amount) + '원</b>' +
      (l.photo_path ? '<button class="btn sm" data-act="pp-photo" data-path="' + esc(l.photo_path) + '">📷</button>' : '') +
      (ppCanCancel(l) ? '<button class="btn sm danger" data-act="pp-cancel" data-id="' + esc(l.id) + '">취소</button>' : '') + '</div>';
  }
  function ppCodeForm(title, sub){
    return '<div class="pin-wrap"><div style="font-size:18px;font-weight:600;margin-bottom:6px">' + esc(title) + '</div><div class="muted" style="margin-bottom:14px">' + esc(sub) + '</div>' +
      '<input class="pin" id="pp-code" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" style="width:240px;letter-spacing:10px">' +
      '<div style="margin-top:18px"><button class="btn primary" data-act="pp-login">들어가기</button></div></div>';

  // 엑셀 붙여넣기 읽기: 머리글(번호/이름/잔액)이 있으면 그 칸, 없으면 줄마다 휴대폰 번호·마지막 숫자 칸으로 추측
  function ppParseImport(text){
    var lines = String(text || '').split(/\r?\n/).filter(function(l){ return l.trim(); });
    var split = function(l){ return (l.indexOf('\t') >= 0 ? l.split('\t') : l.split(',')).map(function(c){ return c.trim().replace(/^"|"$/g, ''); }); };
    var col = { phone: -1, name: -1, bal: -1 }, start = 0;
    for (var i = 0; i < Math.min(lines.length, 5); i++){
      var hit = false;
      split(lines[i]).forEach(function(c, j){
        if (col.bal < 0 && /잔액|잔여|포인트|남은/.test(c)){ col.bal = j; hit = true; }
        else if (col.phone < 0 && /전화|연락처|휴대|핸드폰|번호/.test(c)){ col.phone = j; hit = true; }
        else if (col.name < 0 && /이름|성함|고객명|회원명|닉네임/.test(c)){ col.name = j; hit = true; }
      });
      if (hit){ start = i + 1; break; }
    }
    var isPhone = function(d){ return /^01\d{8,9}$/.test(d); };
    var money = function(c){ var raw = String(c == null ? '' : c).replace(/[,원P\s]/g, ''); return /^\d+(\.\d+)?$/.test(raw) ? Math.floor(+raw) : null; };
    var out = [];
    lines.slice(start).forEach(function(l){
      var cells = split(l), phone = col.phone >= 0 ? ppDigits(cells[col.phone]) : '';
      if (!isPhone(phone)){ phone = ''; cells.some(function(c){ var d = ppDigits(c); if (isPhone(d) && /^[0-9\-\s.]+$/.test(c)){ phone = d; return true; } return false; }); }
      var bal = col.bal >= 0 ? money(cells[col.bal]) : null;
      if (bal == null && col.bal < 0){ for (var k = cells.length - 1; k >= 0; k--){ var m = money(cells[k]); if (m != null && ppDigits(cells[k]) !== phone){ bal = m; break; } } }
      var name = col.name >= 0 ? (cells[col.name] || '') : (cells.filter(function(c){ return /[가-힣a-zA-Z]/.test(c) && !/\d{3,}/.test(c); })[0] || '');
      if (!phone && bal == null) return;
      out.push({ phone: phone, name: name, balance: bal, ok: !!phone && bal != null });
    });
    return out;
  }

  // 시연 모드(?demo=1)용: DB 함수와 같은 규칙을 메모리에서 흉내 (코드: 사장님 000000, 성수 111111, 왕십리 222222, 중계 333333, 답십리 444444)
  function ppMemRpc(T, fn, a){
    if (!T.__pp){
      T.__pp = { owner: '000000', codes: { b1: '111111', b2: '222222', b3: '333333', b4: '444444' }, bonus_min: 100000, bonus_rate: 5 };
      T.prepay_customers = [ { id: 'pc1', phone: '01012345678', name: '김단골', pin: '1234' }, { id: 'pc2', phone: '01098765432', name: '성수 디자인랩', pin: null } ];
      T.prepay_ledger = [
        { id: 'pl1', customer_id: 'pc1', kind: 'charge', amount: 105000, paid: 100000, bonus: 5000, branch_id: 'b1', staff_name: '알바 A', created_at: daysAgo(3) },
        { id: 'pl2', customer_id: 'pc1', kind: 'use', amount: -12000, paid: 0, bonus: 0, branch_id: 'b2', staff_name: '알바 F', memo: '케이크', created_at: daysAgo(1) },
        { id: 'pl3', customer_id: 'pc2', kind: 'import', amount: 250000, paid: 250000, bonus: 0, branch_id: 'b1', staff_name: '사장님', by_owner: true, memo: '기존 앱 잔액', created_at: daysAgo(5) }
      ];
    }
    var S = T.__pp, L = T.prepay_ledger, C = T.prepay_customers;
    var err = function(m){ return { ok: false, error: m }; };
    var bal = function(cid){ var s = 0; L.forEach(function(l){ if (l.customer_id === cid) s += l.amount; }); return s; };
    var bon = function(cid){ var s = 0; L.forEach(function(l){ if (l.customer_id === cid) s += l.bonus || 0; }); return s; };
    var cust = function(id){ return C.filter(function(c){ return c.id === id; })[0]; };
    var byId = function(id){ return L.filter(function(l){ return l.id === id; })[0]; };
    var dec = function(l){ return Object.assign({}, l, { canceled: L.some(function(z){ return z.cancel_of === l.id; }), orig_kind: l.cancel_of ? (byId(l.cancel_of) || {}).kind : null }); };
    var add = function(row){ L.push(Object.assign({ id: uid(), paid: 0, bonus: 0, branch_id: a.p_branch, staff_name: staffName(a.p_staff), by_owner: role === 'owner', created_at: new Date().toISOString() }, row)); };
    if (fn === 'prepay_status') return { ready: !!S.owner, bonus_min: S.bonus_min, bonus_rate: S.bonus_rate, branches: Object.keys(S.codes) };
    if (fn === 'prepay_owner_init'){ if (S.owner) return err('사장님 코드가 이미 정해져 있어요'); S.owner = a.p_code; return { ok: true }; }
    var code = a.p_code || a.p_owner_code;
    var role = code && code === S.owner ? 'owner' : (code && S.codes[a.p_branch] === code ? 'branch' : null);
    if (!role) return err('선결제 코드가 틀려요');
    if (['prepay_customers_all', 'prepay_refund', 'prepay_import', 'prepay_set_code', 'prepay_set_bonus'].indexOf(fn) >= 0 && role !== 'owner') return err('사장님 코드가 필요해요');
    var c, b;
    switch (fn){
      case 'prepay_login': return { ok: true, role: role };
      case 'prepay_find': {
        var d = ppDigits(a.p_q), q = String(a.p_q || '').trim();
        return { ok: true, rows: C.filter(function(x){ return d.length >= 4 ? x.phone.slice(-d.length) === d : (x.name || '').indexOf(q) >= 0; }).map(function(x){ return { id: x.id, phone: x.phone, name: x.name, has_pin: !!x.pin, balance: bal(x.id) }; }) };
      }
      case 'prepay_customer':
        c = cust(a.p_customer); if (!c) return err('손님을 못 찾았어요');
        b = bal(c.id);
        return { ok: true, role: role, customer: { id: c.id, phone: c.phone, name: c.name, has_pin: !!c.pin }, balance: b, bonus_left: bon(c.id), refundable: Math.max(0, b - bon(c.id)),
          ledger: L.filter(function(l){ return l.customer_id === c.id; }).map(dec).sort(function(x, y){ return x.created_at < y.created_at ? 1 : -1; }) };
      case 'prepay_charge': {
        var ph = ppDigits(a.p_phone), extra = a.p_paid >= S.bonus_min ? Math.floor(a.p_paid * S.bonus_rate / 100) : 0;
        c = C.filter(function(x){ return x.phone === ph; })[0];
        if (!c){ c = { id: uid(), phone: ph, name: a.p_name || null, pin: a.p_pin || null }; C.push(c); }
        else { if (a.p_name) c.name = a.p_name; if (a.p_pin) c.pin = a.p_pin; }
        add({ customer_id: c.id, kind: 'charge', amount: a.p_paid + extra, paid: a.p_paid, bonus: extra, memo: a.p_memo || null });
        return { ok: true, customer_id: c.id, bonus: extra, balance: bal(c.id) };
      }
      case 'prepay_use':
        b = bal(a.p_customer);
        if (a.p_amount > b) return err('잔액이 모자라요 (남은 돈 ' + won(b) + '원)');
        add({ customer_id: a.p_customer, kind: 'use', amount: -a.p_amount, memo: a.p_memo || null, photo_path: a.p_photo || null });
        return { ok: true, balance: b - a.p_amount };
      case 'prepay_cancel': {
        var l = byId(a.p_ledger); if (!l) return err('기록을 못 찾았어요');
        if (l.kind === 'cancel' || dec(l).canceled) return err('이미 취소했어요');
        if (role !== 'owner' && (['charge', 'use'].indexOf(l.kind) < 0 || l.branch_id !== a.p_branch || localDateKey(l.created_at) !== todayStr())) return err('오늘 우리 매장의 충전·사용만 취소할 수 있어요. 그 밖의 건 사장님께 말해 주세요');
        b = bal(l.customer_id);
        if (b - l.amount < 0) return err('이미 쓴 돈이 있어서 이 충전을 취소하면 잔액이 마이너스가 돼요');
        add({ customer_id: l.customer_id, kind: 'cancel', amount: -l.amount, paid: -l.paid, bonus: -l.bonus, cancel_of: l.id, memo: a.p_reason || null });
        return { ok: true, balance: b - l.amount };
      }
      case 'prepay_set_customer': c = cust(a.p_customer); if (a.p_name) c.name = a.p_name; if (a.p_pin) c.pin = a.p_pin; return { ok: true };
      case 'prepay_report':
        return { ok: true, role: role, rows: L.filter(function(l){ var d = localDateKey(l.created_at); return d >= a.p_from && d <= a.p_to && (role === 'owner' || l.branch_id === a.p_branch); })
          .map(function(l){ var x = dec(l), cc = cust(l.customer_id) || {}; x.name = cc.name; x.phone = cc.phone; return x; }).sort(function(x, y){ return x.created_at < y.created_at ? 1 : -1; }) };
      case 'prepay_customers_all':
        return { ok: true, rows: C.map(function(x){ var last = null; L.forEach(function(l){ if (l.customer_id === x.id && (!last || l.created_at > last)) last = l.created_at; }); return { id: x.id, phone: x.phone, name: x.name, has_pin: !!x.pin, balance: bal(x.id), bonus_left: bon(x.id), last_at: last }; }).sort(function(x, y){ return y.balance - x.balance; }) };
      case 'prepay_refund':
        b = bal(a.p_customer); if (b <= 0) return err('남은 잔액이 없어요');
        var bl = bon(a.p_customer), ref = Math.max(0, b - bl);
        add({ customer_id: a.p_customer, kind: 'refund', amount: -b, paid: -ref, bonus: -bl, memo: a.p_memo || null });
        return { ok: true, refund: ref, forfeit: b - ref };
      case 'prepay_import': {
        var added = 0, skipped = 0;
        a.p_rows.forEach(function(r){ var x = C.filter(function(y){ return y.phone === r.phone; })[0]; if (x && L.some(function(l){ return l.customer_id === x.id && l.kind === 'import'; })){ skipped++; return; } if (!x){ x = { id: uid(), phone: r.phone, name: r.name || null, pin: null }; C.push(x); } add({ customer_id: x.id, kind: 'import', amount: r.balance, paid: r.balance, memo: '기존 앱 잔액' }); added++; });
        return { ok: true, added: added, skipped: skipped, bad: 0 };
      }
      case 'prepay_set_code': if (a.p_branch) S.codes[a.p_branch] = a.p_new_code; else S.owner = a.p_new_code; return { ok: true };
      case 'prepay_set_bonus': S.bonus_min = a.p_min; S.bonus_rate = a.p_rate; return { ok: true };
    }
    return err('모르는 기능: ' + fn);
  }

  app.addEventListener('click', async function(e){
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    try {
      switch (act){
        case 'back': history.length > 1 ? history.back() : nav('#/home'); break;
        case 'logout': if (window.confirm('다른 이름으로 들어갈까요?')){ saveSession(null); nav('#/login'); } break;
        case 'owner-quick': await ownerQuick(); break;

        case 'buy-photo': { var bu = await db.signedUrl('receipts', el.getAttribute('data-path')); window.open(bu, '_blank'); break; }
        case 'buy-update': await buyUpdate(id); break;
        case 'buy-del': if (window.confirm('이 구매 기록을 지울까요? (사진도 같이 지워져요)')){ var bp = el.getAttribute('data-path'); await db.remove('ops_staff_purchases', { id: id }); if (bp) db.removeFile('receipts', bp).catch(function(){}); toast('지웠어요'); render(); } break;
        case 'expense-cal-toggle': expenseCalendarOpen = !expenseCalendarOpen; render(); break;
        case 'buy-cal-toggle': buyCalendarOpen = !buyCalendarOpen; render(); break;
        case 'buy-list-view': buyListView = el.getAttribute('data-view'); render(); break;
        case 'buy-csv': downloadCsv(); break;
        case 'stmt-run': el.disabled = true; try { await stmtRun(); } finally { el.disabled = false; } break;
        case 'stmt-add': el.disabled = true; try { await stmtAdd(+el.getAttribute('data-g')); } finally { el.disabled = false; } break;
        case 'stmt-add-all': el.disabled = true; try { await stmtAddAll(); } finally { el.disabled = false; } break;
        case 'stmt-filter': stmtState.filter = id; render(); break;
        case 'stmt-jump': { var sec = document.getElementById('sec-' + id), body = document.getElementById('ex-' + id); if (body) body.classList.remove('hidden'); if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); else toast('해당하는 게 없어요'); break; }
        case 'cards-add': cardsRead(); cardsState.push({ last4: '', name: '', branch_id: null, ask_branch: false, active: true }); cardsKeep = true; render(); break;
        case 'cards-toggle': { cardsRead(); var cc = cardsState[+el.getAttribute('data-i')]; cc.active = cc.active === false; cardsKeep = true; render(); break; }
        case 'cards-save': await cardsSave(); break;
        // 입사 서류
        case 'docs-new-staff': { var nn = window.prompt('새 직원 이름'); if (!nn) break; nn = nn.trim(); if (!nn) break; if (base.staff.some(function(x){ return x.name === nn && x.active !== false; })){ toast('이미 명단에 있는 이름이에요'); break; } var nr = await db.insert('manual_staff', { name: nn, branch_id: el.getAttribute('data-branch'), role: 'staff', active: true }); toast(nn + ' 추가했어요'); nav('#/docs-prep/' + nr[0].id); break; }
        case 'docs-del-batch': if (window.confirm('준비한 서류를 지울까요? (서명 전 서류만 지워져요)')){ (await db.select('ops_documents', { eq: { batch_id: id } })).forEach(function(r){ if (r.pdf_path) db.removeFile(DOCS_BUCKET, r.pdf_path).catch(function(){}); }); await db.remove('ops_documents', { batch_id: id }); toast('지웠어요'); if (current.route === 'docs-view') nav('#/docs-admin'); else render(); } break;
        case 'docs-resend': await docsResend(id, el); break;
        case 'docs-open-pdf': { var du = await db.signedUrl(DOCS_BUCKET, el.getAttribute('data-path')); window.open(du, '_blank'); break; }
        case 'docs-settings-save': await docsSettingsSave(); break;
        case 'docs-seal-remove': await saveDocsSettings({ seal: null }); toast('직인을 지웠어요'); render(); break;
        case 'uni-toggle': { prepRead(); var ukey = el.getAttribute('data-key'); prepState.uniform[ukey].on = !prepState.uniform[ukey].on; prepKeep = true; render(); break; }
        case 'prep-save': el.disabled = true; try { await prepSave(); } finally { el.disabled = false; } break;
        case 'sign-branch': signState.branchId = id; try { localStorage.setItem(KIOSK_KEY, id); } catch(err){} render(); break;
        case 'sign-branch-reset': signState.branchId = null; try { localStorage.removeItem(KIOSK_KEY); } catch(err){} if (session && !isOwner()){ toast('내 매장에서만 서명할 수 있어요'); break; } render(); break;
        case 'sign-pick': signState.staffId = id; signState.ok = false; render(); break;
        case 'sign-back': signReset(); render(); break;
        case 'sign-pin': await signPin(); break;
        case 'sign-info-next': el.disabled = true; try { await signInfoNext(); } finally { el.disabled = false; } break;
        case 'sign-files-next': el.disabled = true; try { await signFilesNext(); } finally { el.disabled = false; } break;
        case 'sub-del': if (window.confirm('원본 파일을 지울까요? "제출했었다"는 기록은 남아요.')){ var spth = el.getAttribute('data-path'); await db.update('ops_documents', { id: id }, { status: 'removed', pdf_path: null, updated_at: nowIso() }); if (spth) db.removeFile(DOCS_BUCKET, spth).catch(function(){}); toast('원본을 지웠어요'); render(); } break;
        case 'sign-prev': signReadChecks(); var sd = sigPadData('sigpad'); if (sd) signState.sig = sd; signState.idx = Math.max(0, signState.idx - 1); render(); break;
        case 'sign-doc-next': el.disabled = true; try { await signDocNext(false); } finally { el.disabled = false; } break;
        case 'sign-gskip': el.disabled = true; try { await signDocNext(true); } finally { el.disabled = false; } break;
        case 'sig-clear': sigPadClear(id); break;
        case 'sig-redo': signReadChecks(); signState.sig = null; render(); break;
        case 'gsig-redo': signReadChecks(); signState.gsig = null; render(); break;
        case 'sign-restart': signReset(); render(); break;
        case 'uret-save': el.disabled = true; try { await uretSave(); } finally { el.disabled = false; } break;
        case 'uret-sig-redo': uretRead(); uretState.sig = null; render(); break;
        case 'usw-toggle': { uswRead(); var us = uswState[el.getAttribute('data-side')][el.getAttribute('data-key')]; us.on = !us.on; render(); break; }
        case 'usw-save': el.disabled = true; try { await uswSave(); } finally { el.disabled = false; } break;
        case 'usw-sig-redo': uswRead(); uswState.sig = null; render(); break;
        // 보건증
        case 'hc-retake': hcState.photo = null; render(); break;
        case 'hc-submit': el.disabled = true; try { await hcSubmit(); } finally { el.disabled = false; } break;
        case 'hc-photo': { var hu = await db.signedUrl(HC_BUCKET, el.getAttribute('data-path')); window.open(hu, '_blank'); break; }
        case 'hc-toggle': hcState.open[id] = !hcState.open[id]; render(); break;
        case 'hc-confirm': el.disabled = true; try { await hcConfirm(id); } finally { el.disabled = false; } break;
        case 'hc-manual': await hcManual(id); break;
        case 'hc-del': if (window.confirm('이 보건증 기록을 지울까요? (사진도 같이 지워져요)')){ var hp = el.getAttribute('data-path'); await db.remove('ops_health_certs', { id: id }); if (hp) db.removeFile(HC_BUCKET, hp).catch(function(){}); toast('지웠어요'); render(); } break;
        case 'rs-import-preview': rsImportPreview(); break;
        case 'rs-import-save': el.disabled = true; try { await rsImportSave(); } finally { el.disabled = false; } break;
        case 'rs-refresh': el.disabled = true; try { await rsRefresh(); } finally { el.disabled = false; } break;
        case 'rs-quit': await rsQuit(id); break;
        // 청년지원금
        case 'subsidy-add-toggle': subsidyState.addOpen = !subsidyState.addOpen; render(); break;
        case 'subsidy-add-save': el.disabled = true; try { await subsidyAddSave(); } finally { el.disabled = false; } break;
        case 'subsidy-stop': { var reason = window.prompt('퇴사·중단 사유 (예: 8개월차 퇴사)', ''); if (reason === null) break; await subsidyStopEmployee(id, reason); break; }
        case 'subsidy-reactivate': await db.update('ops_subsidy_employees', { id: id }, { active: true, stop_reason: null, updated_at: nowIso() }); toast('다시 재직중으로'); render(); break;
        case 'subsidy-emp-edit': await subsidyEditHire(id); break;
        case 'subsidy-case-save': el.disabled = true; try { await subsidyCaseSave(id); } finally { el.disabled = false; } break;
        case 'subsidy-checklist-toggle': await subsidyChecklistToggle(el.getAttribute('data-case'), +el.getAttribute('data-i')); break;
        case 'subsidy-checklist-add': await subsidyChecklistAdd(el.getAttribute('data-case')); break;
        case 'subsidy-checklist-del': if (window.confirm('이 항목을 지울까요?')){ await subsidyChecklistDel(el.getAttribute('data-case'), +el.getAttribute('data-i')); } break;
        case 'subsidy-file-view': { var fu = await db.signedUrl(SUBSIDY_BUCKET, el.getAttribute('data-path')); window.open(fu, '_blank'); break; }
        case 'subsidy-log-add': el.disabled = true; try { await subsidyLogAdd(el.getAttribute('data-case')); } finally { el.disabled = false; } break;
      }
    } catch(err){ console.error(err); toast('실패했어요: ' + (err.message || err)); }
  });
  app.addEventListener('change', async function(e){
    if (e.target.id === 'ptg-staff'){ patGridStaff = e.target.value; render(); return; }
    if (e.target.id === 'ex-rec' || e.target.id === 'ex-kind'){ extraFill(); return; }
    if (e.target.id === 'ex-start' || e.target.id === 'ex-end'){ extraCalc(); return; }
    if (e.target.id === 'exp-file'){ await expPhotoPicked(e.target.files && e.target.files[0]); return; }
    if (e.target.id === 'stmt-text'){ if (e.target.value.trim()) { try { await stmtRun(); } catch(err){ toast('실패: ' + (err.message || err)); } } return; }   // 붙여넣기만 해도 바로 저장·대조
    if (e.target.id === 'buy-file'){ await buyPhotoPicked(e.target.files && e.target.files[0]); return; }
    if (e.target.id === 'pp-use-file'){ await ppUsePhotoPicked(e.target.files && e.target.files[0]); return; }
    if (e.target.id === 'hc-file'){ await hcPhotoPicked(e.target.files && e.target.files[0]); return; }
    if (e.target.id === 'tf-file'){ await tfPhotoPicked(e.target.files && e.target.files[0]); return; }
    if (e.target.id === 'tf-item'){ var tfu = document.getElementById('tf-unit'); if (tfu) tfu.textContent = (e.target.selectedOptions[0] && e.target.selectedOptions[0].getAttribute('data-unit')) || ''; return; }
    if (e.target.classList.contains('qty-unlimited')){
      var uItemId = e.target.getAttribute('data-item');
      var uQtyInp = app.querySelector('.qty[data-item="' + uItemId + '"]');
      var uAltInp = app.querySelector('.ct-alt[data-item="' + uItemId + '"]');
      if (uQtyInp){ uQtyInp.disabled = e.target.checked; if (e.target.checked){ uQtyInp.value = ''; uQtyInp.classList.remove('filled'); } }
      if (uAltInp){ uAltInp.disabled = e.target.checked; if (e.target.checked) uAltInp.value = ''; }
      checkUpdateCount();
      return;
    }
    if (e.target.classList.contains('hc-manual-file')){ await hcAdminPhotoPicked(e.target.getAttribute('data-staff'), e.target.files && e.target.files[0]); return; }
    if (e.target.classList.contains('subsidy-checklist-file')){ await subsidyChecklistFilePicked(e.target.getAttribute('data-case'), +e.target.getAttribute('data-i'), e.target.files && e.target.files[0]); return; }
    if (e.target.id === 'sc-log-file'){ await subsidyLogFilePicked(e.target.files && e.target.files[0]); return; }
    if (e.target.classList.contains('sub-file')){ subReadSkips(); await subPicked(e.target.getAttribute('data-kind'), e.target.files && e.target.files[0]); return; }
    if (e.target.classList.contains('sub-file-later')){ await subLaterPicked(e.target.getAttribute('data-batch'), e.target.getAttribute('data-kind'), e.target.files && e.target.files[0]); return; }
    if (e.target.id === 'pp-imp'){ prepaySt.importText = e.target.value; prepaySt.importRows = e.target.value.trim() ? ppParseImport(e.target.value) : null; render(); return; }   // 붙여넣기만 해도 미리보기
    if (e.target.id === 'rs-import'){ rsState.importText = e.target.value; if (e.target.value.trim()) rsImportPreview(); return; }   // 붙여넣기만 해도 바로 읽어 보기
    if (e.target.id === 'buy-method'){ buyRecalc(buyIdsForm(), e.target.id); return; }
    { var bmm = /^bm-(.+)$/.exec(e.target.id || ''); if (bmm){ buyRecalc(buyIdsRow(bmm[1]), e.target.id); return; } }
    if (e.target.id === 'exp-card'){ var opt = e.target.selectedOptions && e.target.selectedOptions[0], bsel = document.getElementById('exp-branch'); if (opt && bsel && opt.value && opt.getAttribute('data-ask') !== '1') bsel.value = opt.getAttribute('data-branch') || ''; return; }
    var el = e.target.closest('[data-act="role"]'); if (!el) return;
    try { await db.update('manual_staff', { id: el.getAttribute('data-id') }, { role: el.value }); toast('역할을 바꿨어요'); render(); } catch(err){ toast('실패: ' + (err.message || err)); }
  });
  app.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target.id === 'pp-code'){ e.preventDefault(); ppLogin().catch(function(err){ toast('실패했어요: ' + (err.message || err)); }); return; }
    if (e.key === 'Enter' && e.target.id === 'pp-q'){ e.preventDefault(); ppSearch().catch(function(err){ toast('실패했어요: ' + (err.message || err)); }); return; }
    if (e.key === 'Enter' && e.target.classList.contains('pin')){ e.preventDefault(); if (current.route === 'sign') signPin(); else if (current.route === 'clock') clockPin(); else pinGo(); } });
  // 화면 캡처(스크린샷)를 파일로 안 저장하고 바로 붙여넣기(Ctrl+V) — 직원 구매·영수증 올리기 사진 올리기 화면에서만
  document.addEventListener('paste', async function(e){
    if (!current) return;
    var route = current.route;
    if (route !== 'buy' && route !== 'expense' && route !== 'transfer' && route !== 'prepay-c') return;
    if (route === 'buy' && buyState.ocrBusy) return;
    if (route === 'expense' && expState.ocrBusy) return;
    if (route === 'prepay-c' && prepaySt.act !== 'use') return;
    var dt = e.clipboardData || window.clipboardData; if (!dt || !dt.items) return;
    var file = null;
    for (var i = 0; i < dt.items.length; i++){ if (dt.items[i].kind === 'file' && /^image\//.test(dt.items[i].type)){ file = dt.items[i].getAsFile(); break; } }
    if (!file) return;
    e.preventDefault();
    if (route === 'expense') await expPhotoPicked(file);
    else if (route === 'transfer') await tfPhotoPicked(file);
    else if (route === 'prepay-c') await ppUsePhotoPicked(file);
    else await buyPhotoPicked(file);
  });
  app.addEventListener('input', function(e){
    if (e.target.classList.contains('birth')){ fmtBirthTyping(e.target); return; }
    if (e.target.classList.contains('resident')){ fmtResidentTyping(e.target); return; }
    if (e.target.id === 'item-search'){ itemSearchFilter(e.target.value); return; }
    if (e.target.id === 'pp-paid'){ ppChargePreview(); return; }
    if (e.target.id === 'pp-cf'){ var ppk = e.target.value.trim(), ppkd = ppDigits(ppk); app.querySelectorAll('.pp-cust').forEach(function(r){ var k = r.getAttribute('data-k') || ''; r.classList.toggle('hidden', !!ppk && k.indexOf(ppk) < 0 && !(ppkd.length >= 3 && ppDigits(k).indexOf(ppkd) >= 0)); }); return; }
    if (e.target.id === 'chk-search'){ checkSearchFilter(e.target.value); return; }
    if (e.target.id === 'tf-item-search'){
      var tfSel = document.getElementById('tf-item');
      if (tfSel){
        tfSel.innerHTML = itemOptions(null, e.target.value);
        var tfu2 = document.getElementById('tf-unit'), first = tfSel.querySelector('option');
        if (tfu2) tfu2.textContent = first ? (first.getAttribute('data-unit') || '') : '';
      }
      return;
    }
    if (/^buy-(list|disc|paid)$/.test(e.target.id || '')){ buyRecalc(buyIdsForm(), e.target.id); return; }
    var bim = /^b[lcp]-(.+)$/.exec(e.target.id || ''); if (bim){ buyRecalc(buyIdsRow(bim[1]), e.target.id); return; }
    if (e.target.classList.contains('ct-alt')){
      var altItemId = e.target.getAttribute('data-item'), factor = num(e.target.getAttribute('data-factor')) || 1;
      var qtyInp = app.querySelector('.qty[data-item="' + altItemId + '"]');
      if (qtyInp){
        var altV = num(e.target.value);
        qtyInp.value = (altV == null || e.target.value === '') ? '' : String(Math.round((altV / factor) * 100) / 100);
        qtyInp.dispatchEvent(new Event('input', { bubbles: true }));
      }
      return;
    }
    if (current.route !== 'check' || !e.target.classList.contains('qty')) return;
    e.target.classList.toggle('filled', e.target.value !== '');
    checkUpdateCount();
  });

  // ===== 시작 =====
  if (DEMO) db = makeMemoryDb(demoSeed());
  else if (window.supabase && typeof window.supabase.createClient === 'function') db = makeSupabaseDb(window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY));
  if (!db){ app.innerHTML = '<div class="note danger">데이터 창고 연결 스크립트를 못 불러왔어요. 인터넷을 확인하고 새로고침해 주세요.</div>'; return; }
  if (DEMO && session && session.staffId && session.staffId.length > 4) saveSession(null);
  window.addEventListener('hashchange', render);
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
